<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Math</title>
<meta name="description" content="Personalized math practice for grades 6 to 12: a learning path, step-by-step lessons and live speed races.">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4675078529012990"
     crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0f1f; --bg2:#0e1428; --card:#131a31; --card2:#1b2341; --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --text:#e9edfb; --muted:#8f99ba; --good:#22c55e; --bad:#f43f5e; --warn:#f59e0b; --gold:#fbbf24;
  --accent:#6d7cff; --ink:#fff; --soft:rgba(109,124,255,.16);
  --r:20px; color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:#f3f5fa; --bg2:#ffffff; --card:#ffffff; --card2:#eef1f8; --line:rgba(15,23,42,.08); --line2:rgba(15,23,42,.16);
  --text:#0f172a; --muted:#5f6b85; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(640px 420px at 88% -8%,var(--soft),transparent 70%),radial-gradient(520px 420px at -8% 108%,var(--soft),transparent 70%)}
h1,h2,h3,.num{font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif;letter-spacing:-.02em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--muted)}

/* shell */
.side{position:fixed;left:0;top:0;bottom:0;z-index:10;width:244px;display:flex;flex-direction:column;gap:4px;padding:22px 14px;background:var(--bg2);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px;font-family:"Space Grotesk";font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.mark{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:.9rem;font-weight:700;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent),#fff 35%))}
.navi{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;color:var(--muted);font-weight:600;text-align:left;transition:background .15s,color .15s}
.navi:hover{background:var(--card2);color:var(--text)}
.navi.on{background:var(--soft);color:var(--accent)}
.navi.dot::after{content:"";position:absolute;right:12px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.side .grow{flex:1}
.mecard{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:14px;text-align:left;background:var(--card);border:1px solid var(--line)}
.mecard b{display:block;font-size:.92rem;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mecard small{color:var(--muted);font-weight:600;font-size:.76rem}
.av{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;line-height:1;
  background:linear-gradient(135deg,var(--c,var(--accent)),color-mix(in srgb,var(--c,var(--accent)),#000 32%))}
.av.sm{width:28px;height:28px;border-radius:9px;font-size:.95rem}
.av.lg{width:76px;height:76px;border-radius:22px;font-size:2.5rem}
.main{margin-left:244px;min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding:30px 32px 60px}
.topbar,.tabs{display:none}
@media (max-width:900px){
  .side{display:none}
  .main{margin-left:0}
  .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));
    background:color-mix(in srgb,var(--bg),transparent 12%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;font-size:1.15rem;flex:1}
  .topbar .mark{width:30px;height:30px}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--bg2),transparent 6%);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .tabs .navi{flex:1;flex-direction:column;gap:3px;padding:7px 2px;font-size:.7rem;text-align:center;background:none}
  .tabs .navi.dot::after{top:6px;right:calc(50% - 16px)}
  .wrap{padding:20px 16px 110px}
}
body.focus .side,body.focus .topbar,body.focus .tabs{display:none}
body.focus .main{margin-left:0}

/* building blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1000px){.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:2rem;line-height:1.1;margin-top:4px}
.pagehead p{color:var(--muted);margin-top:6px;font-weight:500}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cardhead h2{font-size:1.1rem}
.cardhead a,.link{color:var(--accent);font-weight:700;font-size:.88rem;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;color:var(--ink);background:var(--accent);
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent),transparent 68%);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:default;filter:none;transform:none;box-shadow:none}
.btn.ghost{color:var(--text);background:var(--card2);box-shadow:none}
.btn.white{color:#111827;background:#fff;box-shadow:none}
.btn.good{color:#fff;background:var(--good);box-shadow:0 8px 22px rgba(34,197,94,.3)}
.btn.block{width:100%}
.btn.lg{padding:16px 24px;font-size:1.05rem;border-radius:16px}
.btn.sm{padding:8px 14px;border-radius:11px;font-size:.86rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--card2);font-weight:700;font-size:.86rem;white-space:nowrap}
.chip .ic{width:16px;height:16px}
.chip.fire{color:#fb923c}
.chip.gold{color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:.74rem;font-weight:700;color:var(--accent);background:var(--soft)}
.bar{height:8px;border-radius:8px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px;background:var(--accent);transition:width .6s}
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .rt b{font-family:"Space Grotesk";font-size:1.05em}
.empty{padding:18px;border-radius:14px;background:var(--card2);color:var(--muted);font-weight:600;text-align:center}

/* home */
.hero{position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent),#05061a 45%))}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero::before{width:280px;height:280px;right:-80px;top:-120px}
.hero::after{width:160px;height:160px;right:90px;bottom:-90px}
.hero > *{position:relative;z-index:1}
.hero .eyebrow{color:rgba(255,255,255,.78)}
.hero h2{font-size:1.75rem;line-height:1.15;margin:8px 0 6px}
.hero p{color:rgba(255,255,255,.85);font-weight:500}
.hero .bar{background:rgba(255,255,255,.2);margin:18px 0 8px;max-width:420px}
.hero .bar i{background:#fff}
.hero small{color:rgba(255,255,255,.8);font-weight:600}
.hero .btn{margin-top:18px}
.goal{display:flex;align-items:center;gap:18px}
.goal .num{font-size:1.5rem;font-weight:700}
.goal p{color:var(--muted);font-weight:500;font-size:.9rem;margin-top:2px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.mini{padding:12px;border-radius:14px;background:var(--card2)}
.mini b{display:block;font-family:"Space Grotesk";font-size:1.25rem}
.mini span{color:var(--muted);font-weight:600;font-size:.78rem}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--card2)}
.row .ri{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)),transparent 84%)}
.row .rb{flex:1;min-width:0}
.row .rb b{display:block;font-size:.93rem;line-height:1.3}
.row .rb small{color:var(--muted);font-weight:600;font-size:.78rem}
.row .rb .bar{margin-top:7px;height:6px}
.row .rr{flex:none;font-weight:700;font-size:.85rem;color:var(--muted)}
.row.claimable{box-shadow:inset 0 0 0 1.5px var(--gold)}
.row.dim{opacity:.55}
.reco{display:flex;flex-wrap:wrap;gap:8px}
.arena-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.arena-card .grow{flex:1;min-width:180px}
.shield{width:52px;height:52px;flex:none;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--lc),color-mix(in srgb,var(--lc),#000 35%))}
.shield .ic{width:26px;height:26px}

/* path */
.course-pick{display:flex;gap:8px;flex-wrap:wrap}
.course-pick button{padding:8px 14px;border-radius:999px;font-weight:700;font-size:.86rem;background:var(--card2);color:var(--muted)}
.course-pick button.on{background:var(--accent);color:var(--ink)}
.unit{padding:0;overflow:hidden}
.unithead{display:flex;align-items:center;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line)}
.unithead .ub{flex:1;min-width:0}
.unithead h2{font-size:1.25rem;margin-top:2px}
.unithead small{color:var(--muted);font-weight:600}
.steps-list{display:flex;flex-direction:column;padding:8px 10px 12px}
.stp{position:relative;display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;text-align:left;width:100%}
.stp:not(.locked):hover{background:var(--card2)}
.stp::before{content:"";position:absolute;left:31px;top:-8px;height:14px;width:2px;background:var(--line2)}
.stp:first-child::before{display:none}
.sdot{position:relative;width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--card2);color:var(--muted);border:2px solid var(--line2)}
.sdot .ic{width:18px;height:18px}
.stp.done .sdot{background:var(--good);border-color:var(--good);color:#fff}
.stp.cur .sdot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 6px var(--soft)}
.stp .sb{flex:1;min-width:0}
.stp .sb b{display:block;font-size:.98rem}
.stp .sb small{color:var(--muted);font-weight:600;font-size:.8rem}
.stp .score{font-family:"Space Grotesk";font-weight:700;font-size:.95rem}
.stp.locked{cursor:default;opacity:.5}
.stp .go{flex:none}
.placed{color:var(--good);font-weight:700;font-size:.8rem}

/* focus screens: lessons, quizzes, check-in */
.focuswrap{max-width:780px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:16px;padding:16px 20px 28px}
.ftop{display:flex;align-items:center;gap:14px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;background:var(--card2);color:var(--muted)}
.iconbtn:hover{color:var(--text)}
.segs{flex:1;display:flex;gap:5px}
.segs i{flex:1;height:8px;border-radius:6px;background:var(--card2)}
.segs i.ok{background:var(--good)}
.segs i.no{background:var(--bad)}
.segs i.half{background:var(--warn)}
.segs i.cur{background:var(--accent)}
.fcount{font-weight:700;font-size:.85rem;color:var(--muted);white-space:nowrap}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:30px 22px 24px;text-align:center}
.qcard .tag{margin-bottom:14px}
.prompt{color:var(--muted);font-weight:600;margin-bottom:14px;line-height:1.45}
.q{font-family:"Space Grotesk";font-weight:600;font-size:clamp(1.6rem,6.2vw,2.5rem);line-height:1.35;overflow-wrap:anywhere}
.q.wordy{max-width:34em;margin:0 auto;font-family:"Plus Jakarta Sans";font-size:clamp(1.05rem,3.6vw,1.25rem);font-weight:600;line-height:1.55}
.q .ln{display:block}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;font-size:.8em;line-height:1.15}
.fr > span:first-child{padding:0 .2em .05em;border-bottom:2px solid currentColor}
.fr > span:last-child{padding:.05em .2em 0}
.rt-sym{white-space:nowrap}
.rt-sym span{border-top:2px solid currentColor;padding:0 .1em}
sup{font-size:.6em}
.ansrow{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;flex-wrap:wrap}
.ans{min-width:190px;max-width:100%;min-height:64px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:16px;
  font-family:"Space Grotesk";font-size:1.85rem;font-weight:600;background:var(--bg);border:2px solid var(--accent);box-shadow:0 0 0 4px var(--soft)}
.ans .ph{font-family:"Plus Jakarta Sans";font-size:.95rem;font-weight:600;color:var(--muted)}
.ans .caret{width:2px;height:1.05em;margin-left:2px;background:var(--accent);animation:blink 1s steps(1) infinite}
.ans.ok{border-color:var(--good);box-shadow:0 0 0 4px rgba(34,197,94,.18)}
.ans.no{border-color:var(--bad);box-shadow:0 0 0 4px rgba(244,63,94,.16);animation:shake .35s}
.affix{font-family:"Space Grotesk";font-size:1.4rem;font-weight:600;color:var(--muted)}
.kbhint{margin-top:14px;color:var(--muted);font-size:.8rem;font-weight:600}
.qtools{display:flex;justify-content:center;gap:10px;margin-top:12px}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:700;font-size:.85rem}
.tbtn:hover{background:var(--card2);color:var(--text)}
.tbtn .ic{width:17px;height:17px}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:auto}
.key{padding:15px 0;border-radius:14px;background:var(--card2);font-family:"Space Grotesk";font-size:1.4rem;font-weight:600;transition:transform .05s}
.key:active{transform:scale(.95)}
.key .ic{width:22px;height:22px;margin:0 auto;display:block}
.key.go{grid-column:span 2;background:var(--accent);color:var(--ink);font-family:"Plus Jakarta Sans";font-size:1rem;font-weight:700}
@media (min-width:901px) and (hover:hover){.lesson .pad{display:none}}
@media (max-width:900px),(hover:none){.kbhint{display:none}}
.fb{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:18px;animation:up .25s}
.fb .fi{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;color:#fff}
.fb .fbody{flex:1;min-width:0}
.fb b{display:block;font-size:1.02rem;margin-bottom:2px}
.fb p{color:var(--muted);font-weight:500;line-height:1.5}
.fb ol{margin:8px 0 0 18px;line-height:1.6;font-weight:500}
.fb .btn{flex:none;align-self:center}
.fb.ok{background:color-mix(in srgb,var(--good),transparent 88%);border:1px solid color-mix(in srgb,var(--good),transparent 60%)}
.fb.ok .fi{background:var(--good)}
.fb.try{background:color-mix(in srgb,var(--warn),transparent 88%);border:1px solid color-mix(in srgb,var(--warn),transparent 60%)}
.fb.try .fi{background:var(--warn)}
.fb.no{background:color-mix(in srgb,var(--bad),transparent 89%);border:1px solid color-mix(in srgb,var(--bad),transparent 62%)}
.fb.no .fi{background:var(--bad)}
.fb.info{background:var(--card);border:1px solid var(--line)}
.fb.info .fi{background:var(--accent)}
@media (max-width:600px){.fb{flex-wrap:wrap}.fb .btn{width:100%}}
.learn h1{font-size:1.9rem;margin:10px 0 8px}
.learn .lead{color:var(--muted);font-size:1.02rem;line-height:1.65;font-weight:500}
.example{background:var(--card2);border:0}
.example .q{font-size:clamp(1.4rem,5vw,2rem);margin:6px 0 4px}
.example .q.wordy{font-size:1.05rem;text-align:left;margin:6px 0 4px}
.steps{list-style:none;display:flex;flex-direction:column;gap:10px;margin:16px 0 14px;counter-reset:s}
.steps li{display:flex;align-items:flex-start;gap:12px;line-height:1.6;font-weight:500;animation:up .3s}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;flex:none;border-radius:8px;display:grid;place-items:center;font-size:.82rem;font-weight:700;color:var(--accent);background:var(--soft)}
.steps li.final::before{content:"✓";color:#fff;background:var(--good)}

/* results */
.res{max-width:640px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 20px;text-align:center}
.res h1{font-size:2.1rem;line-height:1.15}
.res > p{color:var(--muted);font-weight:500;max-width:30em;line-height:1.5}
.statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stat{padding:14px 10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.stat b{display:block;font-family:"Space Grotesk";font-size:1.45rem}
.stat span{color:var(--muted);font-weight:600;font-size:.78rem}
.news{display:flex;flex-direction:column;gap:8px;width:100%}
.news span{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-weight:600;text-align:left;animation:up .4s backwards}
.breakdown{width:100%;text-align:left}
.breakdown .row{background:var(--card)}
.resbtns{display:flex;gap:10px;width:100%;flex-wrap:wrap}
.resbtns .btn{flex:1;min-width:160px}

/* onboarding */
.onb{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:28px 20px}
.onbcard{width:100%;max-width:540px;display:flex;flex-direction:column;gap:20px}
.onbcard h1{font-size:2.1rem;line-height:1.12}
.onbcard .lead{color:var(--muted);font-size:1.05rem;line-height:1.6;font-weight:500}
.logo-xl{display:flex;align-items:center;gap:14px;font-family:"Space Grotesk";font-weight:700;font-size:2.2rem;letter-spacing:-.03em}
.logo-xl .mark{width:54px;height:54px;border-radius:16px;font-size:1.3rem}
.feats{display:grid;gap:10px}
.feat{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:600}
.feat .ri{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;color:var(--accent);background:var(--soft)}
.onbdots{display:flex;gap:6px}
.onbdots i{width:28px;height:6px;border-radius:6px;background:var(--card2)}
.onbdots i.on{background:var(--accent)}
.field{width:100%;padding:16px 18px;border-radius:14px;font-size:1.15rem;font-weight:600;background:var(--card);border:1.5px solid var(--line2);outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.note{color:var(--muted);font-size:.85rem;font-weight:500}
.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.course{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;text-align:left;background:var(--card);border:1.5px solid var(--line)}
.course:hover{border-color:var(--line2)}
.course.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.course .cn{width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:1.05rem;color:var(--accent);background:var(--soft)}
.course b{display:block}
.course small{color:var(--muted);font-weight:600;font-size:.78rem}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px}
.avpick{aspect-ratio:1;border-radius:14px;font-size:1.6rem;background:var(--card2);border:2px solid transparent}
.avpick.on{border-color:var(--accent);background:var(--soft)}
.placelist{display:flex;flex-direction:column;gap:10px}

/* profile and progress */
.prof{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.prof h2{font-size:1.5rem}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.sw{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:12px;border-radius:14px;text-align:left;background:var(--card2);border:2px solid transparent}
.sw.on{border-color:var(--sc)}
.sw i{width:100%;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--sc),color-mix(in srgb,var(--sc),#000 35%))}
.sw b{font-size:.88rem}
.sw small{display:flex;align-items:center;gap:4px;color:var(--muted);font-weight:700;font-size:.76rem}
.sw small .ic{width:14px;height:14px}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:var(--card2)}
.seg button{padding:8px 16px;border-radius:10px;font-weight:700;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.setrow:first-of-type{border-top:0;padding-top:4px}
.setrow b{display:block;font-size:.95rem}
.setrow small{color:var(--muted);font-weight:500;font-size:.82rem}
.namerow{display:flex;gap:8px;max-width:420px}
.namerow .field{padding:11px 14px;font-size:1rem}
.chart{width:100%;height:auto;display:block}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:800px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.tile .ic{color:var(--c,var(--accent))}
.tile b{display:block;font-family:"Space Grotesk";font-size:1.6rem;margin-top:8px}
.tile span{color:var(--muted);font-weight:600;font-size:.8rem}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:16px;background:var(--card2)}
.bdg .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--card)}
.bdg b{font-size:.9rem}
.bdg small{color:var(--muted);font-weight:500;font-size:.78rem;line-height:1.35}
.bdg.got .bi{color:#fff;background:linear-gradient(135deg,var(--gold),#f97316)}
.bdg:not(.got){opacity:.6}
.skilltbl{display:flex;flex-direction:column;gap:8px}

/* arena */
.arena-hero{position:relative;overflow:hidden;color:#fff;border:0;background:radial-gradient(circle at 90% -10%,color-mix(in srgb,var(--accent),#fff 10%) 0,transparent 55%),linear-gradient(160deg,#1e1b4b,#0b0b24)}
.arena-hero .lead{color:rgba(255,255,255,.75);font-weight:500;margin:4px 0 16px}
.arena-hero .bar{background:rgba(255,255,255,.15)}
.arena-hero small{color:rgba(255,255,255,.7);font-weight:600}
.arena-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.arena-row .btn{flex:1;min-width:180px}
.arena-hero .seg{background:rgba(255,255,255,.1)}
.arena-hero .seg button{color:rgba(255,255,255,.7)}
.arena-hero .seg button.on{background:#fff;color:#111827}
.pools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pool{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:18px;text-align:left;background:var(--card);border:1px solid var(--line);transition:border-color .15s,transform .1s}
.pool:hover{border-color:var(--pc)}
.pool:active{transform:scale(.98)}
.pool .pi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;color:#fff;background:var(--pc)}
.pool b{font-size:1rem}
.pool small{color:var(--muted);font-weight:600;font-size:.8rem}
.lobby{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 20px;text-align:center}
.lobby h1{font-size:1.9rem}
.lobby p{color:var(--muted);font-weight:600}
.joined{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:420px}
.pl{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:.9rem;animation:popin .35s backwards}
.pl .av{width:48px;height:48px;font-size:1.6rem;border-radius:14px}
.pl.you{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.count{min-height:7rem;font-family:"Space Grotesk";font-weight:700;font-size:6rem;line-height:1.15;color:var(--accent)}
.count span{display:inline-block;animation:popin .45s}
.live{max-width:780px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:12px;padding:14px 18px 22px}
.hud{display:flex;align-items:center;gap:12px}
.hudscore{flex:1;text-align:center;line-height:1}
.hudscore b{display:block;font-family:"Space Grotesk";font-size:2rem;font-variant-numeric:tabular-nums}
.hudscore span{color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.timer{position:relative;width:52px;height:52px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}
.timer .trk{stroke:var(--card2)}
.timer #tm{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:119.4}
.timer.low #tm{stroke:var(--bad)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:600;font-size:1.1rem}
.timer.low span{color:var(--bad)}
.board{--rh:30px;position:relative;height:calc(var(--n) * var(--rh) + 10px);border-radius:16px;background:var(--card);border:1px solid var(--line);overflow:hidden}
.lb{position:absolute;top:5px;left:5px;right:5px;height:var(--rh);display:flex;align-items:center;gap:9px;padding:0 9px;border-radius:10px;font-weight:700;font-size:.88rem;transition:transform .45s ease}
.lb.you{z-index:1;color:var(--ink);background:var(--accent)}
.lb .rk{width:20px;height:20px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:.72rem;background:var(--card2)}
.lb.you .rk{background:rgba(255,255,255,.25)}
.lb[data-rank="1"] .rk{background:var(--gold);color:#422006}
.lb .av{width:22px;height:22px;border-radius:7px;font-size:.8rem}
.lb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .pt{font-family:"Space Grotesk";font-variant-numeric:tabular-nums}
.liveq{position:relative;flex:1;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 14px}
.liveq .q{font-size:clamp(1.4rem,5.5vw,2.2rem)}
.liveq .q.wordy{font-size:clamp(.98rem,3.4vw,1.15rem)}
.liveq .ansrow{margin-top:16px}
.liveq .ans{min-height:56px;font-size:1.6rem}
.liveq.flash-ok{animation:okflash .35s}
.liveq.flash-no{animation:noflash .45s}
@keyframes okflash{30%{border-color:var(--good);box-shadow:0 0 30px rgba(34,197,94,.35)}}
@keyframes noflash{30%{border-color:var(--bad);box-shadow:0 0 30px rgba(244,63,94,.3)}}
.combo{position:absolute;top:12px;left:12px;padding:5px 11px;border-radius:999px;font-weight:800;font-size:.8rem;color:#fff;background:linear-gradient(90deg,#f97316,#f43f5e);animation:popin .3s}
.gain{position:absolute;top:12px;right:14px;font-family:"Space Grotesk";font-weight:700;font-size:1.4rem;color:var(--good);animation:gainup .7s forwards;pointer-events:none}
@keyframes gainup{to{transform:translateY(-18px);opacity:0}}
.hint-line{min-height:1.4em;margin-top:8px;font-weight:700;color:var(--bad)}
.skip{margin-top:4px;color:var(--muted);font-weight:700;font-size:.85rem;text-decoration:underline}
.timesup{position:fixed;inset:0;z-index:60;display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:3rem;color:#fff;background:rgba(5,8,20,.7);animation:fade .2s}
@media (max-height:740px){.board{--rh:25px}.lb{font-size:.8rem}.key{padding:11px 0}.liveq{min-height:140px}}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;max-width:400px}
.pod{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.88rem}
.pod .av{width:54px;height:54px;border-radius:16px;font-size:1.7rem}
.pod.p1 .av{width:66px;height:66px;font-size:2.1rem}
.pod .nm{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod.you .nm{color:var(--accent)}
.pod .blk{width:100%;margin-top:4px;padding-top:10px;border-radius:14px 14px 0 0;font-family:"Space Grotesk";font-size:1.5rem;color:#fff}
.pod.p1 .blk{height:100px;color:#422006;background:linear-gradient(var(--gold),#d97706)}
.pod.p2 .blk{height:74px;background:linear-gradient(#cbd5e1,#64748b)}
.pod.p3 .blk{height:54px;background:linear-gradient(#fdba74,#c2410c)}
.review{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.review span{padding:7px 11px;border-radius:11px;font-weight:600;font-size:.88rem;background:var(--card);border:1px solid var(--line)}

/* sign-in */
.gsi{min-height:46px;display:flex;justify-content:center}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:13px 20px;border-radius:999px;font-weight:700;font-size:1rem;color:#1f1f1f;background:#fff;border:1px solid #dadce0;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.gbtn:hover{background:#f7f8f8}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line2)}
.acct{display:inline-flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card2);font-size:.86rem;color:var(--muted);font-weight:600;max-width:100%}
.acct img{width:28px;height:28px;border-radius:50%;flex:none}
.acct span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct b{color:var(--text)}

/* avatars and market */
.av.r-rare{box-shadow:0 0 0 2px #3b82f6}
.av.r-epic{box-shadow:0 0 0 2px #a855f7,0 0 14px rgba(168,85,247,.55)}
.av.r-legendary{box-shadow:0 0 0 2px #f59e0b,0 0 18px rgba(245,158,11,.6);animation:legend 2.4s ease-in-out infinite}
@keyframes legend{50%{box-shadow:0 0 0 2px #fde047,0 0 26px rgba(253,224,71,.8)}}
.odds{display:flex;flex-wrap:wrap;gap:6px}
.odds span{padding:4px 9px;border-radius:8px;font-size:.74rem;font-weight:700;color:var(--rc);background:color-mix(in srgb,var(--rc),transparent 86%)}
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 16px 16px;border-radius:22px;text-align:center;border:1px solid var(--line);
  background:linear-gradient(170deg,color-mix(in srgb,var(--bc),transparent 72%),var(--card) 62%)}
.box .bx{font-size:3.6rem;line-height:1.1;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3));transition:transform .2s}
.box:hover .bx{transform:translateY(-4px) rotate(-5deg)}
.box b{font-family:"Space Grotesk";font-size:1.2rem}
.box small{color:var(--muted);font-weight:600}
.peek{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;width:100%;margin:4px 0 6px;font-size:1.05rem}
.peek .q{display:grid;place-items:center;border-radius:6px;font-size:.7rem;font-weight:800;color:var(--muted);background:var(--card2)}
.collhead{display:flex;align-items:baseline;justify-content:space-between;margin:16px 0 8px}
.collhead small{color:var(--muted);font-weight:700}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.ci{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:16px;font-size:.76rem;font-weight:700;background:var(--card2);border:2px solid transparent}
button.ci:hover{border-color:var(--line2)}
.ci.on{border-color:var(--accent);background:var(--soft)}
.ci .av{width:52px;height:52px;border-radius:16px;font-size:1.8rem}
.ci small{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rc)}
.ci.lock .av{background:var(--card);box-shadow:none;color:var(--muted);font-family:"Space Grotesk";font-size:1.4rem}
button.ci.lock .av span{filter:grayscale(1);opacity:.45}
.ci small .ic{width:12px;height:12px;vertical-align:-2px}
.ci.lock > span:nth-child(2){color:var(--muted)}
.opening{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0 10px}
.opening .bx{font-size:5.5rem;line-height:1;animation:shakebox .45s ease-in-out infinite}
.opening p{margin:0}
@keyframes shakebox{25%{transform:rotate(-9deg) scale(1.06)}75%{transform:rotate(9deg) scale(1.06)}}
.reveal{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;animation:popin .5s}
.reveal .rays{position:absolute;top:-10px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc),transparent 45%),transparent 68%);pointer-events:none}
.reveal .av{position:relative;width:112px;height:112px;margin-top:6px;border-radius:32px;font-size:4.2rem}
.reveal h2{margin:2px 0 4px}
.rlabel{margin-top:10px;font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.reveal .stack{width:100%}

/* sheet, toast, confetti */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,8,20,.6);backdrop-filter:blur(4px);animation:fade .2s}
.sheet{width:100%;max-width:440px;padding:26px 22px;border-radius:24px;text-align:center;background:var(--card);border:1px solid var(--line2);animation:up .25s}
.sheet h2{font-size:1.4rem;margin:10px 0 6px}
.sheet p{color:var(--muted);font-weight:500;line-height:1.5;margin-bottom:18px}
.sheet .big{font-size:3rem;line-height:1}
.sheet .stack{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;top:16px;left:50%;z-index:70;transform:translateX(-50%);max-width:min(92vw,440px);padding:12px 16px;border-radius:14px;font-weight:700;text-align:center;color:var(--text);background:var(--card);border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.3);animation:fade .2s}
.cf{position:fixed;top:-16px;z-index:80;width:9px;height:14px;border-radius:3px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}}
@keyframes popin{from{transform:scale(.4);opacity:0}70%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{50%{transform:scale(1.06)}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<aside class="side" id="side"></aside>
<div class="main">
  <header class="topbar" id="topbar"></header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const view = $('#view');
let RNG = Math.random; // swapped for a seeded generator for worked examples and the daily challenge
const r = (a, b) => Math.floor(RNG()*(b-a+1)) + a;
const pick = a => a[Math.floor(RNG()*a.length)];
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j = r(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const seeded = s => () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hash = str => [...str].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const ord = n => n + (['th','st','nd','rd'][n] || 'th');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const withSeed = (seed, fn) => { RNG = seeded(seed); try { return fn(); } finally { RNG = Math.random; } };

/* ================= icons ================= */
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',
  path:'<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19H16a3.5 3.5 0 0 0 0-7H8a3.5 3.5 0 0 1 0-7h7.5"/>',
  zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  chart:'<path d="M3 3v18h18"/><path d="M8 17v-6M13 17V7M18 17v-4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  flame:'<path d="M12 22c4 0 7-2.7 7-7 0-4-3-6-4-9-1 2-2 3-4 3 0-2 0-4-1-6-3 3-5 6-5 12 0 4.3 3 7 7 7z"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M14.8 9.2c-.5-.8-1.5-1.3-2.8-1.3-1.7 0-2.8.9-2.8 2.1 0 2.8 5.6 1.4 5.6 4.1 0 1.2-1.2 2.1-2.8 2.1-1.3 0-2.4-.5-2.9-1.4M12 6v2M12 16.2V18"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  play:'<path d="M7 4.5v15l12-7.5z" fill="currentColor"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/>',

/* ================= math formatting ================= */
const MI = '−';
const f = n => { n = +(+n).toFixed(6); return n < 0 ? MI + (-n) : '' + n; };
const pn = n => n < 0 ? `(${f(n)})` : f(n);
const sgn = (a, b) => r(a, b) * (RNG() < .5 ? -1 : 1);
const nz = (a, b) => { let v; do v = r(a, b); while(!v); return v; };
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while(b) [a, b] = [b, a % b]; return a; };
const rnd = (v, k=6) => Math.round(v * 10**k) / 10**k;
const FR = (n, d) => `<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const fs = (n, d) => { if(d < 0){ n = -n; d = -d; } const g = gcd(n, d) || 1; n /= g; d /= g; return d === 1 ? f(n) : (n < 0 ? MI : '') + FR(Math.abs(n), d); };
const sup = v => `<sup>${v}</sup>`;
const X2 = `x${sup(2)}`;
// one signed term of an expression: term(3,'x') → " + 3x", term(-1,'x',true) → "−x"
const term = (c, v='', first=false) => {
  if(!c) return '';
  const a = Math.abs(c), body = (a === 1 && v ? '' : a) + v;
  return first ? (c < 0 ? MI : '') + body : ` ${c < 0 ? MI : '+'} ${body}`;
};
const lin = (a, b, v='x') => term(a, v, true) + term(b);
const money = v => '$' + (Number.isInteger(+rnd(v, 2)) ? rnd(v, 2) : (+v).toFixed(2));
const root = (n, k='√') => `<span class="rt-sym">${k}<span>${n}</span></span>`;

    if(k === 1){ const b = r(3, 20), h = r(2, 16), ans = b*h/2;
      return {prompt:'Find the area.', q:`A triangle has a base of ${b} m and a height of ${h} m.`, wordy:true, ans, unit:'m²', hint:'A = ½ × base × height', steps:[`A = ½ × ${b} × ${h}.`, `= ½ × ${b*h} = ${f(ans)} m².`]}; }
    if(k === 2){ const b = r(3, 20), h = r(2, 16);
      return {prompt:'Find the area.', q:`A parallelogram has a base of ${b} m and a height of ${h} m.`, wordy:true, ans:b*h, unit:'m²', hint:'A = base × height', steps:[`A = ${b} × ${h} = ${b*h} m².`]}; }
    const b1 = r(3, 14), b2 = b1 + r(2, 10), h = 2*r(1, 8), ans = (b1 + b2)*h/2;
    return {prompt:'Find the area.', q:`A trapezoid has bases of ${b1} m and ${b2} m and a height of ${h} m.`, wordy:true, ans, unit:'m²', hint:'A = ½(b₁ + b₂)h', steps:[`Add the bases: ${b1} + ${b2} = ${b1 + b2}.`, `A = ½ × ${b1 + b2} × ${h} = ${ans} m².`]}; }},
'angles':{name:'Angle relationships', learn:'Complementary angles add to 90°. Supplementary angles add to 180°. The three angles of a triangle add to 180°. Vertical angles are equal.',
  gen(){ const k = r(1, 4);
    if(k === 1){ const a = r(12, 78); return {prompt:'Find the angle.', q:`Two angles are complementary. One measures ${a}°. What is the other?`, wordy:true, ans:90 - a, unit:'°', hint:'Complementary angles add to 90°.', steps:[`90° − ${a}° = ${90 - a}°.`]}; }
    if(k === 2){ const a = r(20, 160); return {prompt:'Find the angle.', q:`Two angles are supplementary. One measures ${a}°. What is the other?`, wordy:true, ans:180 - a, unit:'°', hint:'Supplementary angles add to 180°.', steps:[`180° − ${a}° = ${180 - a}°.`]}; }
    if(k === 3){ const a = r(25, 100), b = r(20, 150 - a); return {prompt:'Find the angle.', q:`A triangle has angles of ${a}° and ${b}°. What is the third angle?`, wordy:true, ans:180 - a - b, unit:'°', hint:'The angles in a triangle add to 180°.', steps:[`${a}° + ${b}° = ${a + b}°.`, `180° − ${a + b}° = ${180 - a - b}°.`]}; }
    const a = r(25, 155); return {prompt:'Find the angle.', q:`Two lines cross. One of the angles measures ${a}°. What is the angle vertical (directly across) from it?`, wordy:true, ans:a, unit:'°', hint:'Vertical angles are equal.', steps:[`Vertical angles are equal, so the angle is ${a}°.`]}; }},
'exp-rules':{name:'Exponent rules', learn:'Same base multiplied: add the exponents. Same base divided: subtract the exponents. Power of a power: multiply the exponents. Any nonzero number to the 0 power is 1, and a negative exponent means a reciprocal.',
  gen(){ const k = r(1, 5), a = r(2, 9), b = r(2, 6);
    if(k === 1) return {prompt:'Find the missing exponent.', q:`x${sup(a)} · x${sup(b)} = x${sup('?')}`, ans:a + b, hint:'Multiplying with the same base: add the exponents.', steps:[`Add the exponents: ${a} + ${b} = ${a + b}.`]};
    if(k === 2){ const big = a + b; return {prompt:'Find the missing exponent.', q:`x${sup(big)} ÷ x${sup(b)} = x${sup('?')}`, ans:a, hint:'Dividing with the same base: subtract the exponents.', steps:[`Subtract the exponents: ${big} − ${b} = ${a}.`]}; }
    if(k === 3){ const c = r(2, 4); return {prompt:'Find the missing exponent.', q:`(x${sup(b)})${sup(c)} = x${sup('?')}`, ans:b*c, hint:'Power of a power: multiply the exponents.', steps:[`Multiply the exponents: ${b} × ${c} = ${b*c}.`]}; }
    if(k === 4){ const n = r(2, 99); return {prompt:'Evaluate.', q:`${n}${sup(0)}`, ans:1, hint:'Any nonzero number to the 0 power is 1.', steps:['Any nonzero number to the 0 power equals 1.']}; }
    const base = r(2, 4), e = r(1, base === 2 ? 4 : 2), den = base**e;
    return {prompt:'Evaluate. Type a fraction like 1/8.', q:`${base}${sup(MI + e)}`, ans:1/den, show:FR(1, den), hint:'A negative exponent means one over the positive power.', steps:[`${base}${sup(MI + e)} = ${FR(1, `${base}${sup(e)}`)}.`, `= ${FR(1, den)}.`]}; }},
'roots':{name:'Square roots and cube roots', learn:'The square root of n is the number that times itself equals n. The cube root of n is the number that, used as a factor three times, equals n.',
  gen(){ if(RNG() < .65){ const n = r(2, 15); return {prompt:'Evaluate.', q:root(n*n), ans:n, hint:`What number times itself is ${n*n}?`, steps:[`${n} × ${n} = ${n*n}, so ${root(n*n)} = ${n}.`]}; }
    const n = r(2, 6); return {prompt:'Evaluate.', q:root(n**3, '∛'), ans:n, hint:`What number cubed is ${n**3}?`, steps:[`${n} × ${n} × ${n} = ${n**3}, so ${root(n**3, '∛')} = ${n}.`]}; }},
'sci-not':{name:'Scientific notation', learn:'In a × 10ⁿ, move the decimal point n places to the right when n is positive, or n places to the left when n is negative.',
  gen(){ const m = r(11, 99)/10, k = RNG() < .6 ? r(2, 5) : -r(1, 3), ans = rnd(m*10**k, 9);
    return {prompt:'Write in standard form.', q:`${f(m)} × 10${sup(f(k))}`, ans, tol:1e-9, hint:`Move the decimal point ${Math.abs(k)} place${Math.abs(k) > 1 ? 's' : ''} to the ${k > 0 ? 'right' : 'left'}.`,
      steps:[`The exponent is ${f(k)}, so move the decimal ${Math.abs(k)} place${Math.abs(k) > 1 ? 's' : ''} to the ${k > 0 ? 'right' : 'left'}.`, `${f(m)} → ${f(ans)}.`]}; }},
'eq-both':{name:'Variables on both sides', learn:'Collect the x terms on one side and the numbers on the other side. Then divide to get x by itself.',
  gen(){ const x = nz(-9, 9), a = sgn(2, 9); let c; do c = sgn(1, 9); while(c === a); const b = nz(-12, 12), d = a*x + b - c*x, k = a - c;
    return {prompt:'Solve for x.', q:`${lin(a, b)} = ${lin(c, d)}`, ans:x, hint:'Move every x term to the left side first.',
      steps:[`${c > 0 ? 'Subtract' : 'Add'} ${term(Math.abs(c), 'x', true)} ${c > 0 ? 'from' : 'to'} both sides: ${lin(k, b)} = ${f(d)}.`,
             `${b > 0 ? 'Subtract' : 'Add'} ${Math.abs(b)} ${b > 0 ? 'from' : 'to'} both sides: ${term(k, 'x', true)} = ${f(d - b)}.`, `Divide by ${f(k)}: x = ${f(x)}.`]}; }},
'eq-dist':{name:'Equations with parentheses', learn:'Divide both sides by the number outside the parentheses (or distribute it first). Then solve the simpler equation.',
  gen(){ const a = r(2, 9), b = nz(-9, 9), x = nz(-9, 9), c = a*(x + b);
    return {prompt:'Solve for x.', q:`${a}(x${term(b)}) = ${f(c)}`, ans:x, hint:`Divide both sides by ${a} first.`,
      steps:[`Divide both sides by ${a}: x${term(b)} = ${f(x + b)}.`, `${b > 0 ? 'Subtract' : 'Add'} ${Math.abs(b)}: x = ${f(x)}.`]}; }},
'slope':{name:'Slope', learn:'Slope measures how steep a line is: m = (y₂ − y₁) ÷ (x₂ − x₁). It is the change in y divided by the change in x.',
  gen(){ const x1 = r(-6, 6), x2 = x1 + nz(-6, 6), y1 = r(-8, 8), y2 = y1 + r(-8, 8), dy = y2 - y1, dx = x2 - x1;
    return {prompt:'Find the slope of the line through these points. Fractions are fine.', q:`(${f(x1)}, ${f(y1)}) and (${f(x2)}, ${f(y2)})`, ans:dy/dx, show:fs(dy, dx), hint:'Change in y over change in x.',
      steps:[`m = ${FR(`${f(y2)} − ${pn(y1)}`, `${f(x2)} − ${pn(x1)}`)} = ${FR(f(dy), f(dx))}.`, `Simplify: m = ${fs(dy, dx)}.`]}; }},
'f-eval':{name:'Evaluating functions', learn:'f(a) means: put a in place of x in the rule for f, then simplify.',
  gen(){ const k = r(-5, 6);
    if(RNG() < .5){ const m = sgn(1, 9), b = nz(-12, 12), ans = m*k + b;
      return {prompt:`Find f(${f(k)}).`, q:`f(x) = ${lin(m, b)}`, ans, hint:`Replace x with ${pn(k)}.`, steps:[`f(${f(k)}) = ${f(m)} × ${pn(k)}${term(b)}.`, `= ${f(m*k)}${term(b)} = ${f(ans)}.`]}; }
    const b = nz(-6, 6), c = nz(-9, 9), ans = k*k + b*k + c;
    return {prompt:`Find f(${f(k)}).`, q:`f(x) = ${X2}${term(b, 'x')}${term(c)}`, ans, hint:`Replace every x with ${pn(k)}.`, steps:[`f(${f(k)}) = ${pn(k)}${sup(2)}${term(b, '')} × ${pn(k)}${term(c)}.`, `= ${k*k}${term(b*k)}${term(c)} = ${f(ans)}.`]}; }},
'y-int':{name:'Slope-intercept form', learn:'In y = mx + b, m is the slope and b is the y-intercept, where the line crosses the y-axis. If you know the slope and one point, plug them in and solve for b.',
  gen(){ const m = nz(-5, 5), x = nz(-6, 6), b = nz(-10, 10), y = m*x + b;
    return {prompt:'Find the y-intercept.', q:`A line has slope ${f(m)} and passes through (${f(x)}, ${f(y)}). What is its y-intercept, b?`, wordy:true, ans:b, hint:'Plug the point and slope into y = mx + b.',
      steps:[`Use y = mx + b: ${f(y)} = ${f(m)} × ${pn(x)} + b.`, `${f(y)} = ${f(m*x)} + b.`, `b = ${f(y)} − ${pn(m*x)} = ${f(b)}.`]}; }},
'pythag':{name:'The Pythagorean theorem', learn:'In a right triangle with legs a and b and hypotenuse c (the longest side, across from the right angle), a² + b² = c².',
  gen(){ const [a, b, c] = pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10],[9,12,15],[20,21,29]]), k = c > 20 ? 1 : r(1, 2), A = a*k, B = b*k, C = c*k;
    if(RNG() < .55) return {prompt:'Find the missing side.', q:`A right triangle has legs of ${A} and ${B}. How long is the hypotenuse?`, wordy:true, ans:C, hint:'c² = a² + b²',
      steps:[`c² = ${A}${sup(2)} + ${B}${sup(2)} = ${A*A} + ${B*B} = ${C*C}.`, `c = ${root(C*C)} = ${C}.`]};
    return {prompt:'Find the missing side.', q:`A right triangle has a hypotenuse of ${C} and one leg of ${A}. How long is the other leg?`, wordy:true, ans:B, hint:'b² = c² − a²',
      steps:[`b² = ${C}${sup(2)} − ${A}${sup(2)} = ${C*C} − ${A*A} = ${B*B}.`, `b = ${root(B*B)} = ${B}.`]}; }},
'volume':{name:'Volume', learn:'Rectangular prism: V = lwh. Cylinder: V = πr²h. Cone: V = ⅓πr²h. Sphere: V = ⁴⁄₃πr³. Use 3.14 for π.',
  gen(){ const k = r(1, 4);
    if(k === 1){ const l = r(2, 12), w = r(2, 10), h = r(2, 10);
      return {prompt:'Find the volume.', q:`A box is ${l} cm long, ${w} cm wide and ${h} cm tall.`, wordy:true, ans:l*w*h, unit:'cm³', hint:'V = length × width × height', steps:[`V = ${l} × ${w} × ${h} = ${l*w*h} cm³.`]}; }
    const rad = r(2, 6), h = r(3, 12);
    if(k === 2){ const raw = 3.14*rad*rad*h, ans = Math.round(raw);
      return {prompt:'Use 3.14 for π. Round to the nearest whole number.', q:`A cylinder has a radius of ${rad} cm and a height of ${h} cm. Find its volume.`, wordy:true, ans, tol:.51, unit:'cm³', hint:'V = πr²h',
        steps:[`V = 3.14 × ${rad}${sup(2)} × ${h} = 3.14 × ${rad*rad} × ${h}.`, `= ${f(rnd(raw, 2))} ≈ ${ans} cm³.`]}; }
    if(k === 3){ const raw = 3.14*rad*rad*h/3, ans = Math.round(raw);
      return {prompt:'Use 3.14 for π. Round to the nearest whole number.', q:`A cone has a radius of ${rad} cm and a height of ${h} cm. Find its volume.`, wordy:true, ans, tol:.51, unit:'cm³', hint:'V = ⅓πr²h',
        steps:[`V = ⅓ × 3.14 × ${rad}${sup(2)} × ${h}.`, `= ${f(rnd(raw, 2))} ≈ ${ans} cm³.`]}; }
    const raw = 4/3*3.14*rad**3, ans = Math.round(raw);
    return {prompt:'Use 3.14 for π. Round to the nearest whole number.', q:`A ball has a radius of ${rad} cm. Find its volume.`, wordy:true, ans, tol:.51, unit:'cm³', hint:'V = ⁴⁄₃πr³',
      steps:[`V = ⁴⁄₃ × 3.14 × ${rad}${sup(3)} = ⁴⁄₃ × 3.14 × ${rad**3}.`, `= ${f(rnd(raw, 2))} ≈ ${ans} cm³.`]}; }},
'ineq':{name:'Solving inequalities', learn:'Solve an inequality just like an equation, with one extra rule: if you multiply or divide both sides by a negative number, flip the inequality sign.',
  gen(){ const a = sgn(2, 9), x = nz(-10, 10), b = nz(-15, 15), c = a*x + b, s = pick(['<','>','≤','≥']), flip = {'<':'>','>':'<','≤':'≥','≥':'≤'}, s2 = a < 0 ? flip[s] : s;
    return {prompt:`Solve. Fill in the blank: x ${s2} ___`, q:`${lin(a, b)} ${s} ${f(c)}`, ans:x, hint: a < 0 ? 'You will divide by a negative number, so the sign flips.' : `${b > 0 ? 'Subtract' : 'Add'} ${Math.abs(b)} first.`,
      steps:[`${b > 0 ? 'Subtract' : 'Add'} ${Math.abs(b)}: ${term(a, 'x', true)} ${s} ${f(c - b)}.`, `Divide by ${f(a)}${a < 0 ? ' and flip the sign' : ''}: x ${s2} ${f(x)}.`]}; }},
'x-int':{name:'Intercepts', learn:'The x-intercept is where a line crosses the x-axis, so y = 0 there. Set y equal to 0 and solve for x.',
  gen(){ const x0 = nz(-8, 8), m = sgn(1, 6), b = -m*x0;
    return {prompt:'Find the x-intercept (the value of x when y = 0).', q:`y = ${lin(m, b)}`, ans:x0, hint:'Set y to 0 and solve.',
      steps:[`Set y = 0: 0 = ${lin(m, b)}.`, `${b > 0 ? 'Subtract' : 'Add'} ${Math.abs(b)}: ${f(-b)} = ${term(m, 'x', true)}.`, `Divide by ${f(m)}: x = ${f(x0)}.`]}; }},
'sys':{name:'Systems of equations', learn:'The solution of a system makes both equations true. If both are solved for y, set them equal. If one has +y and the other −y, add the equations so y cancels.',
  gen(){ const x = nz(-6, 6);
    if(RNG() < .5){ const a = nz(-5, 5); let c; do c = nz(-5, 5); while(c === a); const b = nz(-10, 10), d = a*x + b - c*x;
      return {prompt:'Solve the system. What is x?', q:`<span class="ln">y = ${lin(a, b)}</span><span class="ln">y = ${lin(c, d)}</span>`, ans:x, hint:'Both expressions equal y, so set them equal to each other.',
        steps:[`Set them equal: ${lin(a, b)} = ${lin(c, d)}.`, `Collect terms: ${term(a - c, 'x', true)} = ${f(d - b)}.`, `x = ${f(x)}.`]}; }
    const y = nz(-6, 6), s = x + y, t = x - y;
    return {prompt:'Solve the system. What is x?', q:`<span class="ln">x + y = ${f(s)}</span><span class="ln">x − y = ${f(t)}</span>`, ans:x, hint:'Add the two equations together.',
      steps:[`Add the equations: 2x = ${f(s)} + ${pn(t)} = ${f(s + t)}.`, `Divide by 2: x = ${f(x)}.`]}; }},
'poly-eval':{name:'Evaluating polynomials', learn:'Substitute the value for x, then follow the order of operations: powers first, then multiplication, then addition and subtraction.',
  gen(){ const a = r(1, 3), b = nz(-6, 6), c = nz(-9, 9), k = nz(-4, 4), ans = a*k*k + b*k + c;
    return {prompt:`Evaluate when x = ${f(k)}.`, q:`${term(a, X2, true)}${term(b, 'x')}${term(c)}`, ans, hint:`Square ${pn(k)} first.`,
      steps:[`Powers first: ${pn(k)}${sup(2)} = ${k*k}.`, `${a} × ${k*k}${term(b)} × ${pn(k)}${term(c)} = ${f(a*k*k)}${term(b*k)}${term(c)}.`, `= ${f(ans)}.`]}; }},
'factor-roots':{name:'Solving quadratics by factoring', learn:'Write x² + bx + c = 0 as (x − p)(x − q) = 0 by finding two numbers that multiply to c and add to b. Each factor can equal 0, so x = p or x = q.',
  gen(){ const p = nz(-9, 9); let q; do q = nz(-9, 9); while(q === p); const B = -(p + q), C = p*q, big = Math.max(p, q);
    const fac = v => `(x${term(-v)})`;
    return {prompt:'Solve by factoring. Type the larger solution.', q:`${X2}${term(B, 'x')}${term(C)} = 0`, ans:big, hint:`Find two numbers that multiply to ${f(C)} and add to ${f(B)}.`,
      steps:[`Two numbers that multiply to ${f(C)} and add to ${f(B)}: ${f(-p)} and ${f(-q)}.`, `Factor: ${fac(p)}${fac(q)} = 0.`, `So x = ${f(p)} or x = ${f(q)}. The larger solution is ${f(big)}.`]}; }},
'vertex':{name:'Vertex of a parabola', learn:'For y = ax² + bx + c, the vertex is at x = −b ÷ (2a). Substitute that x back into the equation to get the y-coordinate.',
  gen(){ const a = sgn(1, 3), h = nz(-5, 5), b = -2*a*h, c = nz(-9, 9), k = a*h*h + b*h + c, askX = RNG() < .5;
    return {prompt:`Find the ${askX ? 'x' : 'y'}-coordinate of the vertex.`, q:`y = ${term(a, X2, true)}${term(b, 'x')}${term(c)}`, ans: askX ? h : k, hint:'Start with x = −b ÷ (2a).',
      steps:[`x = −b ÷ 2a = ${f(-b)} ÷ ${f(2*a)} = ${f(h)}.`].concat(askX ? [] : [`y = ${f(a)} × ${pn(h)}${sup(2)}${term(b)} × ${pn(h)}${term(c)} = ${f(k)}.`])}; }},
'distance':{name:'Distance formula', learn:'The distance between two points is d = √((x₂ − x₁)² + (y₂ − y₁)²). It is the Pythagorean theorem on the coordinate plane.',
  gen(){ let [a, b, c] = pick([[3,4,5],[5,12,13],[6,8,10],[8,15,17]]); if(RNG() < .5) [a, b] = [b, a];
    const x1 = r(-6, 6), y1 = r(-6, 6), x2 = x1 + a*(RNG() < .5 ? 1 : -1), y2 = y1 + b*(RNG() < .5 ? 1 : -1);
    return {prompt:'Find the distance between the points.', q:`(${f(x1)}, ${f(y1)}) and (${f(x2)}, ${f(y2)})`, ans:c, hint:'Find the change in x and the change in y, then use the Pythagorean theorem.',
      steps:[`Change in x: ${a}. Change in y: ${b}.`, `d = ${root(`${a}${sup(2)} + ${b}${sup(2)}`)} = ${root(a*a + b*b)} = ${c}.`]}; }},
'midpoint':{name:'Midpoint', learn:'The midpoint of a segment is halfway between its endpoints. Average the x-coordinates and average the y-coordinates.',
  gen(){ const x1 = r(-9, 9), x2 = x1 + 2*nz(-6, 6), y1 = r(-9, 9), y2 = y1 + 2*nz(-6, 6), askX = RNG() < .5, ans = askX ? (x1 + x2)/2 : (y1 + y2)/2;
    const [u, v] = askX ? [x1, x2] : [y1, y2];
    return {prompt:`Find the ${askX ? 'x' : 'y'}-coordinate of the midpoint.`, q:`(${f(x1)}, ${f(y1)}) and (${f(x2)}, ${f(y2)})`, ans, hint:`Average the ${askX ? 'x' : 'y'}-coordinates.`,
      steps:[`(${f(u)} + ${pn(v)}) ÷ 2 = ${f(u + v)} ÷ 2 = ${f(ans)}.`]}; }},
'poly-angles':{name:'Angles in polygons', learn:'The interior angles of a polygon with n sides add to (n − 2) × 180°. In a regular polygon all angles are equal, so each one is that sum divided by n.',
  gen(){ const names = {5:'pentagon',6:'hexagon',7:'heptagon',8:'octagon',9:'nonagon',10:'decagon',12:'dodecagon'};
    if(RNG() < .5){ const n = pick([5,6,7,8,9,10,12]); return {prompt:'Find the sum of the interior angles.', q:`A ${names[n]} has ${n} sides.`, wordy:true, ans:(n - 2)*180, unit:'°', hint:'(n − 2) × 180°', steps:[`(${n} − 2) × 180° = ${n - 2} × 180° = ${(n - 2)*180}°.`]}; }
    const n = pick([5,6,8,9,10,12]); return {prompt:'Find one interior angle.', q:`What is the measure of each interior angle of a regular ${names[n]} (${n} sides)?`, wordy:true, ans:(n - 2)*180/n, unit:'°', hint:'Find the angle sum, then divide by the number of sides.',
      steps:[`Sum: (${n} − 2) × 180° = ${(n - 2)*180}°.`, `Each angle: ${(n - 2)*180}° ÷ ${n} = ${(n - 2)*180/n}°.`]}; }},
'special-tri':{name:'Special right triangles', learn:'In a 45°-45°-90° triangle, the hypotenuse is a leg times √2. In a 30°-60°-90° triangle, the hypotenuse is twice the short leg and the long leg is the short leg times √3.',
  gen(){ const k = r(1, 3), s = r(2, 12);
    if(k === 1){ const ans = Math.round(s*Math.SQRT2*10)/10; return {prompt:'Round to the nearest tenth.', q:`A 45°-45°-90° triangle has legs of ${s}. How long is the hypotenuse?`, wordy:true, ans, tol:.051, hint:'Multiply the leg by √2 ≈ 1.414.', steps:[`hypotenuse = ${s}√2 ≈ ${s} × 1.414 ≈ ${f(ans)}.`]}; }
    if(k === 2) return {prompt:'Find the side.', q:`In a 30°-60°-90° triangle, the short leg is ${s}. How long is the hypotenuse?`, wordy:true, ans:2*s, hint:'The hypotenuse is twice the short leg.', steps:[`hypotenuse = 2 × ${s} = ${2*s}.`]};
    const ans = Math.round(s*Math.sqrt(3)*10)/10;
    return {prompt:'Round to the nearest tenth.', q:`In a 30°-60°-90° triangle, the short leg is ${s}. How long is the long leg?`, wordy:true, ans, tol:.051, hint:'Multiply the short leg by √3 ≈ 1.732.', steps:[`long leg = ${s}√3 ≈ ${s} × 1.732 ≈ ${f(ans)}.`]}; }},
'trig-ratio':{name:'Trigonometric ratios', learn:'SOH CAH TOA: sine = opposite ÷ hypotenuse, cosine = adjacent ÷ hypotenuse, tangent = opposite ÷ adjacent. The sides are named from the angle you are looking at.',
  gen(){ let [o, a, h] = pick([[3,4,5],[5,12,13],[8,15,17],[7,24,25]]); if(RNG() < .5) [o, a] = [a, o];
    const fn = pick(['sin','cos','tan']), [n, d] = fn === 'sin' ? [o, h] : fn === 'cos' ? [a, h] : [o, a];
    return {prompt:'Type a fraction or a decimal rounded to the hundredth.', q:`In right triangle ABC, the side opposite angle A is ${o}, the side adjacent to A is ${a}, and the hypotenuse is ${h}. Find ${fn} A.`, wordy:true, ans:n/d, show:fs(n, d), tol:.005,
      hint: fn === 'sin' ? 'sin = opposite ÷ hypotenuse' : fn === 'cos' ? 'cos = adjacent ÷ hypotenuse' : 'tan = opposite ÷ adjacent',
      steps:[`${fn} A = ${fn === 'sin' ? 'opposite ÷ hypotenuse' : fn === 'cos' ? 'adjacent ÷ hypotenuse' : 'opposite ÷ adjacent'} = ${FR(n, d)}.`, `≈ ${f(rnd(n/d, 3))}.`]}; }},
'quad-formula':{name:'The quadratic formula', learn:'For ax² + bx + c = 0, x = (−b ± √(b² − 4ac)) ÷ 2a. The part under the root, b² − 4ac, is the discriminant. Positive means two real solutions, zero means one, negative means none.',
  gen(){ if(RNG() < .4){ const a = sgn(1, 4), b = nz(-9, 9), c = nz(-9, 9), D = b*b - 4*a*c;
      return {prompt:'Find the discriminant, b² − 4ac.', q:`${term(a, X2, true)}${term(b, 'x')}${term(c)} = 0`, ans:D, hint:`a = ${f(a)}, b = ${f(b)}, c = ${f(c)}.`,
        steps:[`b² − 4ac = ${pn(b)}${sup(2)} − 4(${f(a)})(${f(c)}).`, `= ${b*b} − ${pn(4*a*c)} = ${f(D)}.`]}; }
    const a = r(1, 3), p = nz(-9, 9), q = nz(-6, 6), A = a, B = -(a*q + p), C = p*q, x1 = p/a, x2 = q, D = B*B - 4*A*C, big = Math.max(x1, x2);
    return {prompt:'Use the quadratic formula. Type the larger solution (fractions are fine).', q:`${term(A, X2, true)}${term(B, 'x')}${term(C)} = 0`, ans:big, show: big === x1 ? fs(p, a) : f(q), hint:`The discriminant is ${f(D)}.`,
      steps:[`Discriminant: b² − 4ac = ${pn(B)}${sup(2)} − 4(${A})(${f(C)}) = ${f(D)}.`, `${root(D)} = ${Math.round(Math.sqrt(D))}.`,
             `x = ${FR(`${f(-B)} ± ${Math.round(Math.sqrt(D))}`, 2*A)}, so x = ${fs(-B + Math.round(Math.sqrt(D)), 2*A)} or x = ${fs(-B - Math.round(Math.sqrt(D)), 2*A)}.`]}; }},
'log-eval':{name:'Evaluating logarithms', learn:'log_b(x) asks: what power of b gives x? For example, log₂ 8 = 3 because 2³ = 8. A log written without a base means base 10.',
  gen(){ const b = pick([2,3,4,5,10]), k = b === 10 ? r(-2, 4) : b === 2 ? r(-3, 6) : r(-2, 4), x = k < 0 ? FR(1, b**-k) : b**k;
    return {prompt:'Evaluate.', q:`log${b === 10 ? '' : `<sub>${b}</sub>`} ${x}`, ans:k, hint:`${b} to what power equals ${x}?`,
      steps:[`Ask: ${b} raised to what power equals ${x}?`, `${b}${sup(f(k))} = ${x}, so the answer is ${f(k)}.`]}; }},
'exp-solve':{name:'Solving exponential equations', learn:'Write both sides as powers of the same base. When the bases match, the exponents must be equal, so set them equal and solve.',
  gen(){ const b = pick([2,3,5]), k = b === 2 ? r(2, 7) : r(2, 4), N = b**k;
    if(RNG() < .5) return {prompt:'Solve for x.', q:`${b}${sup('x')} = ${N}`, ans:k, hint:`Write ${N} as a power of ${b}.`, steps:[`${N} = ${b}${sup(k)}.`, `So ${b}${sup('x')} = ${b}${sup(k)}, and x = ${k}.`]};
    const m = nz(-3, 3);
    return {prompt:'Solve for x.', q:`${b}${sup(`x${term(m)}`)} = ${N}`, ans:k - m, hint:`Write ${N} as a power of ${b}, then set the exponents equal.`, steps:[`${N} = ${b}${sup(k)}.`, `Set the exponents equal: x${term(m)} = ${k}.`, `x = ${f(k - m)}.`]}; }},
'exp-growth':{name:'Exponential growth and decay', learn:'Growth: A = P(1 + r)ᵗ. Decay: A = P(1 − r)ᵗ. P is the starting amount, r is the rate as a decimal and t is the number of time periods.',
  gen(){ const P = pick([100,200,500,1000,2500]), rate = pick([2,3,4,5,8,10]), t = r(2, 6), grow = RNG() < .5, raw = P*(1 + (grow ? 1 : -1)*rate/100)**t, ans = Math.round(raw);
    return {prompt:'Round to the nearest dollar.', q: grow ? `You invest ${money(P)} at ${rate}% interest per year. How much is it worth after ${t} years?` : `A ${money(P)} laptop loses ${rate}% of its value each year. What is it worth after ${t} years?`,
      wordy:true, ans, tol:.51, pre:'$', hint: grow ? `A = ${P}(1 + ${f(rate/100)})${sup(t)}` : `A = ${P}(1 − ${f(rate/100)})${sup(t)}`,
      steps:[`A = ${P} × ${f(1 + (grow ? 1 : -1)*rate/100)}${sup(t)}.`, `= ${f(rnd(raw, 2))} ≈ ${money(ans)}.`]}; }},
'compose':{name:'Composite functions', learn:'f(g(x)) means: work out g(x) first, then put that result into f. Work from the inside out.',
  gen(){ const a = sgn(1, 6), b = nz(-9, 9), k = r(-4, 4), sq = RNG() < .4, c = sgn(1, 5), d = nz(-6, 6), gk = sq ? k*k + d : c*k + d, ans = a*gk + b;
    return {prompt:`Find f(g(${f(k)})).`, q:`<span class="ln">f(x) = ${lin(a, b)}</span><span class="ln">g(x) = ${sq ? X2 + term(d) : lin(c, d)}</span>`, ans, hint:`Find g(${f(k)}) first.`,
      steps:[`g(${f(k)}) = ${f(gk)}.`, `f(${f(gk)}) = ${f(a)} × ${pn(gk)}${term(b)} = ${f(ans)}.`]}; }},
'inverse':{name:'Inverse functions', learn:'An inverse function undoes the original. f⁻¹(k) is the input that makes f(x) = k, so set the rule equal to k and solve for x.',
  gen(){ const a = sgn(2, 6), b = nz(-10, 10), x = nz(-8, 8), k = a*x + b;

'arith-seq':{name:'Arithmetic sequences', learn:'An arithmetic sequence adds the same common difference d each time. The nth term is aₙ = a₁ + (n − 1)d.',
  gen(){ const a1 = nz(-10, 20), d = nz(-6, 9), n = r(8, 25), ans = a1 + (n - 1)*d;

'geom-seq':{name:'Geometric sequences', learn:'A geometric sequence multiplies by the same common ratio r each time. The nth term is aₙ = a₁ · rⁿ⁻¹.',
  gen(){ const a1 = r(1, 5), q = pick([2,3,-2]), n = r(5, q === 3 ? 7 : 9), ans = a1*q**(n - 1);

      steps:[`a₁ = ${a1} and r = ${f(q)}.`, `a<sub>${n}</sub> = ${a1} × ${pn(q)}${sup(n - 1)} = ${a1} × ${f(q**(n - 1))}.`, `= ${f(ans)}.`]}; }},
'arith-sum':{name:'Arithmetic series', learn:'To add the first n terms of an arithmetic sequence, use Sₙ = n(a₁ + aₙ) ÷ 2: the number of terms times the average of the first and last terms.',
  gen(){ const a1 = r(-5, 12), d = nz(-3, 6), n = r(8, 20), an = a1 + (n - 1)*d, ans = n*(a1 + an)/2;
    return {prompt:`Find the sum of the first ${n} terms.`, q:`${[0,1,2,3].map(i => f(a1 + i*d)).join(', ')}, …`, ans, hint:'Find the last term first, then use Sₙ = n(a₁ + aₙ) ÷ 2.',
      steps:[`a<sub>${n}</sub> = ${f(a1)} + ${n - 1} × ${pn(d)} = ${f(an)}.`, `S<sub>${n}</sub> = ${n} × (${f(a1)} + ${pn(an)}) ÷ 2 = ${f(ans)}.`]}; }},
'trig-special':{name:'Trig values of special angles', learn:'Know the special angles: sin 30° = ½, sin 45° = √2⁄2 ≈ 0.707, sin 60° = √3⁄2 ≈ 0.866. Cosine runs the same values in reverse, and tan = sin ÷ cos.',
  gen(){ const TV = {0:[0,'0'],30:[.5,FR(1,2)],45:[Math.SQRT1_2,FR('√2',2)],60:[Math.sqrt(3)/2,FR('√3',2)],90:[1,'1']};

'deg-rad':{name:'Radians and degrees', learn:'π radians = 180°. To change degrees to radians, multiply by π/180. To change radians to degrees, multiply by 180/π.',
  gen(){ const deg = pick([30,45,60,90,120,135,150,180,210,240,270,300,315,330,360]), g = gcd(deg, 180), n = deg/g, d = 180/g;

'log-rules':{name:'Properties of logarithms', learn:'log(xy) = log x + log y and log(x ÷ y) = log x − log y. Combine the logs into one, then evaluate it.',
  gen(){ if(RNG() < .5){ const [b, x, y, k] = pick([[6,4,9,2],[6,2,18,2],[10,4,25,2],[10,2,50,2],[10,8,125,3],[10,5,20,2],[12,3,48,2],[15,5,45,2],[4,2,8,2],[2,4,8,5]]);
      return {prompt:'Evaluate.', q:`log<sub>${b}</sub> ${x} + log<sub>${b}</sub> ${y}`, ans:k, hint:'Adding logs with the same base means multiplying inside.', steps:[`log<sub>${b}</sub> ${x} + log<sub>${b}</sub> ${y} = log<sub>${b}</sub> (${x} × ${y}) = log<sub>${b}</sub> ${x*y}.`, `${b}${sup(k)} = ${x*y}, so the answer is ${k}.`]}; }
    const [b, m] = pick([[2,3],[2,5],[3,2],[3,4],[5,2],[10,3],[10,7]]), k = r(1, b === 10 ? 3 : 4), big = b**k*m;
    return {prompt:'Evaluate.', q:`log<sub>${b}</sub> ${big} − log<sub>${b}</sub> ${m}`, ans:k, hint:'Subtracting logs with the same base means dividing inside.', steps:[`= log<sub>${b}</sub> (${big} ÷ ${m}) = log<sub>${b}</sub> ${b**k}.`, `${b}${sup(k)} = ${b**k}, so the answer is ${k}.`]}; }},
'limit':{name:'Limits', learn:'For a polynomial, the limit as x approaches a is just its value at a. If substituting gives 0 ÷ 0, factor, cancel the common factor, then substitute.',
  gen(){ const a = nz(-5, 5);
    if(RNG() < .5){ const b = nz(-6, 6), c = nz(-9, 9), ans = a*a + b*a + c;
      return {prompt:'Evaluate the limit.', q:`lim<sub>x→${f(a)}</sub> (${X2}${term(b, 'x')}${term(c)})`, ans, hint:'Polynomials are continuous, so just substitute.', steps:[`Substitute x = ${f(a)}: ${pn(a)}${sup(2)}${term(b)} × ${pn(a)}${term(c)}.`, `= ${f(ans)}.`]}; }
    const p = Math.abs(a);
    return {prompt:'Evaluate the limit.', q:`lim<sub>x→${p}</sub> ${FR(`${X2} − ${p*p}`, `x − ${p}`)}`, ans:2*p, hint:'Factor the numerator as a difference of squares.',
      steps:[`Substituting gives 0 ÷ 0, so factor: ${FR(`(x − ${p})(x + ${p})`, `x − ${p}`)}.`, `Cancel (x − ${p}): x + ${p}.`, `Substitute: ${p} + ${p} = ${2*p}.`]}; }},
'deriv':{name:'Derivatives with the power rule', learn:'Power rule: the derivative of axⁿ is n·a·xⁿ⁻¹. The derivative of bx is b, and the derivative of a constant is 0. Find f′(x), then plug in the value.',
  gen(){ const a = nz(-4, 5), n = r(2, 4), b = nz(-9, 9), c = nz(-9, 9), k = nz(-3, 3), ans = a*n*k**(n - 1) + b;

      steps:[`f′(x) = ${term(a*n, xn(n - 1), true)}${term(b)}.`, `f′(${f(k)}) = ${f(a*n)} × ${pn(k)}${n - 1 > 1 ? sup(n - 1) : ''}${term(b)} = ${f(a*n*k**(n - 1))}${term(b)}.`, `= ${f(ans)}.`]}; }}
};

function parseAns(s){
  s = s.replace(/−/g, '-').trim();
  let m;
  if((m = s.match(/^(-?)(\d+) (\d+)\/(\d+)$/))) return (m[1] ? -1 : 1)*(+m[2] + m[3]/m[4]);
  if((m = s.match(/^(-?(?:\d+\.?\d*|\.\d+))\/(-?(?:\d+\.?\d*|\.\d+))$/))) return +m[2] ? m[1]/m[2] : NaN;
  if(/^-?(?:\d+\.?\d*|\.\d+)$/.test(s)) return +s;
  return NaN;
}

const week = () => weekKeys().reduce((a, k) => { const d = S.days[k] || {}; a.sec += d.sec || 0; a.correct += d.correct || 0; a.lessons += d.lessons || 0; return a; }, {sec:0, correct:0, lessons:0});
const dayStreak = () => [dayKey(), dayKey(Date.now() - 864e5)].includes(S.lastDay) ? S.dayStreak : 0;
function markDay(){
  const t = dayKey(); if(S.lastDay === t) return;
  S.dayStreak = S.lastDay === dayKey(Date.now() - 864e5) ? S.dayStreak + 1 : 1; S.lastDay = t;
  const bonus = Math.min(50, S.dayStreak*10);
  S.coins += bonus; news(S.dayStreak > 1 ? `🔥 ${S.dayStreak}-day streak! +${bonus} bonus coins` : `🔥 Streak started! +${bonus} bonus coins`);
  checkBadges();
}
function grant(coins, xp){
  S.coins += coins; S.xp += xp; markDay();
  let up = false;
  while(S.xp >= need(S.level)){ S.xp -= need(S.level); S.level++; up = true; }
  if(up) news(`⭐ Level up! You're now level ${S.level}`);
  save(); return {coins, xp};
}

function quests(){
  const day = dayKey();
  if(!S.quests || S.quests.day !== day){
    const ids = [], seen = new Set();
    withSeed(hash('quests' + day), () => shuffle(QUESTS.slice()).forEach(q => { if(ids.length < 3 && !seen.has(q.m)){ ids.push(q.id); seen.add(q.m); } }));
    S.quests = {day, ids, prog:{}, claimed:[], told:[], chest:false};
  }
  return S.quests;
}
const questDone = id => (quests().prog[QBY[id].m] || 0) >= QBY[id].n;
const canClaim = () => { const q = quests(); return q.ids.some(id => questDone(id) && !q.claimed.includes(id)) || (q.claimed.length === 3 && !q.chest); };
function track(m, n=1){
  const q = quests();
  [q.prog, S.stats].forEach(o => o[m] = MAXM.has(m) ? Math.max(o[m] || 0, n) : (o[m] || 0) + n);
  q.ids.forEach(id => { if(QBY[id].m === m && questDone(id) && !q.told.includes(id)){ q.told.push(id); news(`🎯 Quest complete: ${QBY[id].text}`); } });
  checkBadges(); save();
}
function checkBadges(){ BADGES.forEach(b => { if(!S.badges[b.id] && b.ok()){ S.badges[b.id] = dayKey(); news(`🏅 Badge earned: ${b.name}`); } }); }

let AC;
function beep(freq, dur=.09, type='sine', vol=.06){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
  }catch(e){}
}

// shows Google's own button when a client ID is set; otherwise a look-alike that explains sign-in is not switched on yet
function mountGoogle(){
  const el = $('#gsi'); if(!el) return;
  el.innerHTML = `<button class="gbtn" data-act="google-off">${G_LOGO}<span>Continue with Google</span></button>`;
  if(!GOOGLE_CLIENT_ID) return;

    const box = $('#gsi'); if(!box || !(window.google && google.accounts && google.accounts.id)) return;
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID, callback:googleSignedIn, context:'signup', ux_mode:'popup'});
    box.innerHTML = '';
    google.accounts.id.renderButton(box, {type:'standard', theme: S.mode === 'light' ? 'outline' : 'filled_black', size:'large', shape:'pill', text:'continue_with', width:Math.min(400, box.clientWidth || 320)});
  };
  if(window.google && google.accounts && google.accounts.id) return draw();
  let tag = document.querySelector('script[data-gsi]');
  if(!tag){ tag = document.createElement('script'); tag.src = 'https://accounts.google.com/gsi/client'; tag.async = true; tag.dataset.gsi = '1';
    tag.onerror = () => toast("Couldn't reach Google. Check your connection or play as a guest."); document.head.appendChild(tag); }
  tag.addEventListener('load', draw);
}
function googleSignedIn(resp){
  let p;
  try { const b = resp.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); p = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)))); }
  catch(e){ return toast('Google sign-in did not work. Please try again.'); }
  const who = 'g:' + p.sub, guest = store.get(GUEST_KEY);
  let moved = false;
  if(store.get(keyFor(who))) S = loadSave(who);
  else {
    // first sign-in on this device: bring along any guest progress so nothing is lost
    S = defaults();
    try { const d = guest && JSON.parse(guest); if(d && d.onboarded){ S = fixAvatars(Object.assign(defaults(), d)); store.del(GUEST_KEY); moved = true; } } catch(e){}
  }
  S.account = {email:p.email || '', picture:p.picture || '', name:p.name || ''};
  if(!S.name) S.name = p.given_name || p.name || '';
  setWho(who); save(); applyTheme(); OB = null;
  if(!S.onboarded) return renderOnboard('name');
  RET = 'home'; renderHome();
  toast(moved ? 'Signed in. Your guest progress is now saved to your account.' : `Welcome back, ${S.name}!`);
}

  setWho('guest'); S = loadSave('guest'); applyTheme(); OB = null;
  S.onboarded ? renderHome() : renderOnboard('name');
}

function typeKey(k){
  if(!G || !('typed' in G) || G.learning) return;

  if(G.busy || (G.kind === 'arena' && G.phase !== 'play')) return;

function lessonDone(){
