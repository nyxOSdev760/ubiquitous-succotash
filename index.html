<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Math</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#23204a; --muted:#6c6890; --bg:#eef1ff; --card:#fff; --line:#e3e1f5;
  --sea1:#63cdf5; --sea2:#2f8fe0;
  --violet:#7b5cff; --violet-d:#5a3fd6;
  --green:#2fc16a; --green-d:#1f9650;
  --coral:#ff6b5b; --coral-d:#d94a3c;
  --gold:#ffc83d; --gold-d:#d9a10f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#dfe5ff;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
[hidden]{display:none!important}
.muted{color:var(--muted)}

#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.avatar{width:46px;height:46px;border-radius:50%;background:#efeaff;display:grid;place-items:center;flex:none}
.avatar svg{width:40px;height:40px}
.lvl{flex:1;min-width:0}
.lvl b{font-family:Fredoka;font-weight:600;font-size:1.02rem}
.xp{height:9px;background:#e8e5fb;border-radius:9px;overflow:hidden;margin-top:5px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#7b5cff,#5ec8f2);border-radius:9px;transition:width .6s}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff4d6;color:#7a5000;font-weight:800;padding:6px 11px;border-radius:999px;font-size:.92rem;white-space:nowrap}
.pill.star{background:#fff0f7;color:#a3215c}
.pill.xpp{background:#eeeaff;color:#4b33c2}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;gap:8px;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:6}
.nav button{flex:1;border:0;background:transparent;font-weight:800;font-size:.95rem;color:var(--muted);padding:11px;border-radius:14px}
.nav button.on{background:#efeaff;color:var(--violet)}

/* map */
.map{background:linear-gradient(180deg,var(--sea1),var(--sea2));padding-bottom:84px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(1);opacity:.75}to{transform:scale(1.55);opacity:0}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.wave{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(14px)}}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:18px;padding:16px;font-family:Fredoka;font-weight:600;font-size:1.2rem;color:#fff;
  background:var(--c,var(--violet));box-shadow:0 5px 0 var(--d,var(--violet-d));transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--d,var(--violet-d))}
.btn:disabled{opacity:.5;cursor:default}
.btn.green{--c:var(--green);--d:var(--green-d)}
.btn.coral{--c:var(--coral);--d:var(--coral-d)}
.btn.gold{--c:var(--gold);--d:var(--gold-d);color:#4a3200}
.btn.ghost{--c:#fff;--d:#d9d5ef;color:var(--ink)}
.btn.sm{padding:10px;font-size:1rem;border-radius:14px}
.stack{display:flex;flex-direction:column;gap:14px;width:100%}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(35,32,74,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:28px 28px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;animation:up .28s ease-out}
.sheet .ico{font-size:3.2rem;line-height:1}
.sheet h2{font-size:1.65rem;margin:8px 0 6px}
.sheet p{margin-bottom:18px;line-height:1.45}
.sheet .who{width:110px;height:110px;margin:0 auto}
.tag{display:inline-block;font-weight:800;font-size:.8rem;padding:4px 11px;border-radius:999px;color:#fff;margin-top:10px}
.sstars{font-size:1.6rem;color:var(--gold);letter-spacing:3px;margin-bottom:12px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* play screens */
.play{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.playtop{display:flex;align-items:center;gap:12px}
.x{width:42px;height:42px;border-radius:13px;border:0;background:#fff;font-size:1.2rem;color:var(--muted);box-shadow:0 3px 0 var(--line);flex:none}
.prog{flex:1;height:16px;background:#dfdbf6;border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}
.coach{display:flex;align-items:flex-end;gap:10px}
.coach svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 15px;font-weight:800;box-shadow:0 3px 0 var(--line);line-height:1.35}
.qcard{background:#fff;border-radius:24px;padding:22px 16px;text-align:center;box-shadow:0 6px 0 var(--line)}
.qcard.slim{padding:14px}
.qtext{font-family:Fredoka;font-weight:600;font-size:clamp(2.5rem,12vw,3.5rem);line-height:1.1}
.qtext.md{font-size:clamp(2rem,10vw,2.8rem)}
.model{margin-top:16px;display:flex;justify-content:center}
.model svg{max-width:100%;height:auto}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.ans{border:0;border-radius:20px;padding:20px 0;font-family:Fredoka;font-weight:600;font-size:2rem;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d);transition:transform .06s,box-shadow .06s,opacity .2s}
.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.ans:nth-child(1){--c:#4d8cff;--d:#2f67d6}
.ans:nth-child(2){--c:#9b6bff;--d:#7445e0}
.ans:nth-child(3){--c:#ff6fa8;--d:#d94784}
.ans:nth-child(4){--c:#ffab3d;--d:#d9861a}
.ans.right{--c:var(--green);--d:var(--green-d)}
.ans.wrong{--c:var(--coral);--d:var(--coral-d);animation:shake .35s}
.ans.dim{opacity:.35}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.teach{background:#fff;border-radius:24px;padding:20px;box-shadow:0 6px 0 var(--line)}
.teach h2{font-size:1.6rem;margin:8px 0 6px}
.teach p{line-height:1.5;font-size:1.05rem}
.example{margin-top:16px;padding:16px;border-radius:18px;background:#f5f3ff;text-align:center}
.example .qtext{font-size:2.2rem}

/* results */
.result{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:28px 20px;
  background:radial-gradient(circle at 50% 30%,#fff 0,#eef1ff 60%)}
.result svg.big{width:150px;height:150px}
.result h1{font-size:2.1rem}
.stars{font-size:3.2rem;letter-spacing:8px;line-height:1}
.stars span{color:#dcd8ee;display:inline-block}
.stars span.on{color:var(--gold);animation:popin .45s backwards;text-shadow:0 3px 0 var(--gold-d)}
@keyframes popin{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}}
.rewards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lvlup{background:var(--violet);color:#fff;font-weight:800;padding:10px 16px;border-radius:14px}

/* balloon game */
.sky{position:relative;flex:1;min-height:400px;border-radius:24px;overflow:hidden;background:linear-gradient(#bde8ff,#eef9ff);box-shadow:inset 0 0 0 3px #fff}
.cloud{position:absolute;font-size:2.4rem;opacity:.9}
.balloon{position:absolute;top:0;width:74px;height:88px;border:0;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;
  display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:1.6rem;color:#fff;box-shadow:inset -9px -10px 0 rgba(0,0,0,.13);will-change:transform}
.balloon::before{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:8px solid currentColor;filter:brightness(.8);color:inherit;opacity:0}
.balloon::after{content:"";position:absolute;bottom:-38px;left:50%;width:2px;height:36px;background:rgba(35,32,74,.3)}
.balloon.pop{animation:popb .25s forwards}
.balloon.bad{animation:shake .35s;opacity:.4}
@keyframes popb{to{scale:1.6;opacity:0}}

/* race */
.track{background:#fff;border-radius:24px;padding:14px;box-shadow:0 6px 0 var(--line)}
.lane{position:relative;height:72px;border-radius:16px;margin:6px 0;background:repeating-linear-gradient(90deg,#f3f1fc 0 22px,#e9e6f8 22px 44px)}
.finish{position:absolute;right:0;top:0;bottom:0;width:16px;border-radius:0 16px 16px 0;
  background:repeating-conic-gradient(#23204a 0 25%,#fff 0 50%) 0 0/8px 8px}
.racer{position:absolute;top:4px;left:0;width:64px;height:64px;transition:left .35s ease-out}
.racer svg{width:100%;height:100%}
#rv{transition:none}
.lanelabel{position:absolute;left:10px;bottom:4px;font-size:.75rem;font-weight:800;color:var(--muted)}

/* boss */
.arena{position:relative;border-radius:24px;padding:16px;color:#fff;background:linear-gradient(#3b2a6b,#6243b8);box-shadow:0 6px 0 #2a1d50;overflow:hidden}
.arena.hurt{animation:hurt .4s}
@keyframes hurt{30%{box-shadow:0 6px 0 #2a1d50,inset 0 0 0 200px rgba(255,80,80,.35)}}
.bossrow{display:flex;justify-content:space-between;align-items:center;font-family:Fredoka;font-weight:600}
.hp{height:14px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5b7a,#ffb03d);border-radius:9px;transition:width .4s}
.mon{width:150px;height:150px;margin:6px auto 0;position:relative}
.mon svg{width:100%;height:100%}
.mon.hit{animation:hit .4s}
@keyframes hit{25%{transform:translateX(10px) rotate(6deg);filter:brightness(2)}60%{transform:translateX(-6px)}}
.me{display:flex;align-items:center;gap:8px}
.me svg{width:48px;height:48px}
.hearts{font-size:1.3rem;letter-spacing:2px}
.dmg{position:absolute;left:50%;top:40%;font-family:Fredoka;font-weight:700;font-size:2.2rem;color:#ffe066;text-shadow:0 3px 0 #a3215c;animation:rise .8s forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}
.qtimer{height:10px;background:#dfdbf6;border-radius:9px;overflow:hidden}
.qtimer i{display:block;height:100%;background:var(--violet);border-radius:9px}

/* crew */
.page{padding:22px 16px 100px}
.page h1{font-size:1.9rem}
.page > p{margin:6px 0 18px;line-height:1.45}
.crew{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cc{background:#fff;border-radius:22px;padding:14px;text-align:center;box-shadow:0 5px 0 var(--line);border:3px solid transparent;display:flex;flex-direction:column;gap:6px}
.cc.sel{border-color:var(--violet)}
.cc svg{width:96px;height:96px;margin:0 auto}
.cc h3{font-size:1.25rem}
.cc p{font-size:.85rem;color:var(--muted);flex:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 var(--line)}
.stat b{display:block;font-family:Fredoka;font-weight:600;font-size:1.6rem}
.stat span{font-size:.8rem;color:var(--muted);font-weight:800}

.statgrid.wide{grid-template-columns:repeat(4,1fr);width:100%;max-width:420px;margin-bottom:0}
.statgrid.wide b{font-size:1.3rem}

/* speed arena */
.pill.fire{background:#ffe9e0;color:#b33a12}
.page h2{font-size:1.3rem;margin:22px 0 10px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sound{border:0;background:#fff;border-radius:12px;padding:8px 11px;font-weight:800;color:var(--muted);box-shadow:0 3px 0 var(--line)}
.daily{display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;color:#fff;border-radius:22px;padding:16px;
  background:linear-gradient(135deg,#7b5cff,#4fb6ee);box-shadow:0 5px 0 #4b33c2}
.daily:active{transform:translateY(3px);box-shadow:0 2px 0 #4b33c2}
.daily .big{font-size:2.4rem;line-height:1}
.daily b{display:block;font-family:Fredoka;font-weight:600;font-size:1.25rem}
.daily small{font-weight:700;font-size:.88rem;opacity:.92}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;box-shadow:0 3px 0 var(--line);margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--violet);color:#fff}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk{border:0;background:#fff;border-radius:20px;padding:14px 12px;text-align:left;color:var(--ink);box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:3px}
.sk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.sk .si{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-family:Fredoka;font-weight:700;font-size:1.4rem;color:#fff;background:var(--c)}
.sk b{font-family:Fredoka;font-weight:600;font-size:1.08rem;margin-top:5px}
.sk small{color:var(--muted);font-weight:700;font-size:.8rem}

.lobby{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 18px;text-align:center;color:#fff;
  background:linear-gradient(#3b2a6b,#6243b8)}
.lobby h1{font-size:1.9rem}
.lobby p{font-weight:800;opacity:.85}
.joined{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:360px}
.pl{background:rgba(255,255,255,.12);border-radius:18px;padding:10px 6px;font-weight:800;font-size:.92rem;animation:popin .4s backwards}
.pl svg{width:54px;height:54px;display:block;margin:0 auto 4px}
.pl.you{background:rgba(255,255,255,.26);box-shadow:inset 0 0 0 3px #ffe066}
.count{font-family:Fredoka;font-weight:700;font-size:6.5rem;line-height:1;color:#ffe066;text-shadow:0 6px 0 #a3215c;animation:popin .45s}
#cd{min-height:6.5rem}

.live{gap:10px}
.clock i{background:linear-gradient(90deg,#ffab3d,#ff6b5b);transition:none}
.secs{font-family:Fredoka;font-weight:600;font-size:1.3rem;min-width:40px;text-align:right}
.secs.low{color:var(--coral)}
.board{--rh:26px;position:relative;height:calc(var(--n) * var(--rh) + 8px);background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line);overflow:hidden}
.lb{position:absolute;top:4px;left:6px;right:6px;height:var(--rh);display:flex;align-items:center;gap:8px;padding:0 8px;border-radius:9px;font-weight:800;font-size:.9rem;transition:transform .45s ease}
.lb.you{background:#efeaff;color:var(--violet-d);z-index:1}
.lb .rk{width:16px;color:var(--muted)}
.lb svg{width:22px;height:22px;flex:none}
.lb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .pt{font-variant-numeric:tabular-nums}
.scorebar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:34px}
.score{font-family:Fredoka;font-weight:700;font-size:1.5rem}
.qcard.liveq{position:relative;padding:16px 12px 10px}
.box{display:inline-block;min-width:1.6em;padding:0 .15em;border-radius:14px;background:#f2f0fc;color:var(--violet-d)}
.box:empty::after{content:"";display:inline-block;width:3px;height:.85em;background:var(--violet);vertical-align:-.06em;animation:blink 1s steps(1) infinite}
.box.ok{background:#d9f7e5;color:var(--green-d)}
.box.no{background:#ffe1dd;color:var(--coral-d);animation:shake .35s}
@keyframes blink{50%{opacity:0}}
.hint{min-height:1.5em;margin-top:6px;font-weight:800;color:var(--coral-d)}
.skip{border:0;background:none;color:var(--muted);font-weight:800;font-size:.9rem;text-decoration:underline;padding:4px 10px}
.gain{position:absolute;right:16px;top:10px;font-family:Fredoka;font-weight:700;font-size:1.5rem;color:var(--green);animation:gainup .7s forwards;pointer-events:none}
@keyframes gainup{to{transform:translateY(-18px);opacity:0}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:auto}
.key{border:0;border-radius:16px;padding:13px 0;font-family:Fredoka;font-weight:600;font-size:1.7rem;color:var(--ink);background:#fff;box-shadow:0 5px 0 var(--line);transition:transform .05s,box-shadow .05s}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.key.del{background:#f2f0fc;color:var(--muted)}
.key.go{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green-d)}
.timesup{position:fixed;inset:0;display:grid;place-items:center;background:rgba(35,32,74,.6);z-index:30;font-family:Fredoka;font-weight:700;font-size:3rem;color:#fff;animation:fade .2s}
@media (max-height:720px){
  .board{--rh:22px} .lb{font-size:.82rem} .lb svg{width:18px;height:18px}
  .key{padding:9px 0;font-size:1.5rem} .liveq .qtext{font-size:clamp(2rem,10vw,2.8rem)}
}

.podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%;max-width:360px;margin-top:6px}
.pod{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.9rem}
.pod svg{width:62px;height:62px}
.pod .nm{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod.you .nm{color:var(--violet-d)}
.pod .blk{width:100%;margin-top:4px;border-radius:14px 14px 0 0;padding-top:8px;font-family:Fredoka;font-weight:700;font-size:1.6rem;color:#fff}
.pod.p1 .blk{height:104px;background:var(--gold);color:#7a5000}
.pod.p2 .blk{height:78px;background:#aab6d3}
.pod.p3 .blk{height:58px;background:#e3a173}
.badge{background:var(--gold);color:#4a3200;font-weight:800;padding:8px 14px;border-radius:14px;animation:popin .45s}
.review{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.review span{background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;box-shadow:0 3px 0 var(--line)}

.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:800;z-index:40;max-width:90vw;text-align:center;animation:fade .2s}
.cf{position:fixed;top:-16px;width:10px;height:14px;border-radius:3px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar" id="top"></header>
  <main id="view"></main>
  <nav class="nav" id="nav">
    <button data-tab="map" class="on">🗺️ Map</button>
    <button data-tab="arena">⚡ Arena</button>
    <button data-tab="crew">🐾 Crew</button>
  </nav>
</div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const view = $('#view');
let RNG = Math.random; // swapped for a seeded generator while building the daily challenge
const r = (a,b) => Math.floor(RNG()*(b-a+1))+a;
const pick = a => a[Math.floor(RNG()*a.length)];
const seeded = s => () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hash = str => [...str].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);

const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=r(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function markDay(){
  const today = dayKey(); if(S.lastDay === today) return;
  S.dayStreak = S.lastDay === dayKey(Date.now()-864e5) ? S.dayStreak + 1 : 1; S.lastDay = today;
}

function award(n, stars){
  const first = !S.done[n.id];
  const base = n.type==='lesson' ? 20 : n.type==='boss' ? 50 : 25;
  const coins = first ? base + stars*5 : Math.round(base/4) + stars;
  const xp = first ? 30 + stars*10 : 10 + stars*2;
  if(stars > (S.done[n.id]||0)) S.done[n.id] = stars;
  return grant(coins, xp);
}
function grant(coins, xp){
  S.coins += coins; S.xp += xp; markDay();
  let up = false;
  while(S.xp >= need(S.level)){ S.xp -= need(S.level); S.level++; up = true; }
  save();
  return {coins, xp, up};
}

/* ================= math ================= */
function problem(s){
  let a, b, ans;
  const lo = s.min || 1;
  if(s.op==='+' || s.op==='-'){
    const x = r(lo, s.max-lo), y = r(lo, s.max-x);
    if(s.op==='+'){ a=x; b=y; ans=x+y; } else { a=x+y; b=x; ans=y; }
  }
  if(s.op==='×'){ const f = pick(s.facs), o = r(1, s.max); [a,b] = RNG()<.5 ? [f,o] : [o,f]; ans = a*b; }
  if(s.op==='÷'){ b = pick(s.facs); ans = r(1, s.max); a = b*ans; }
  return {a, b, ans, op:s.op};
}
const calc = p => p.op==='+' ? p.a+p.b : p.op==='-' ? p.a-p.b : p.op==='×' ? p.a*p.b : p.a/p.b;
function choices(ans){
  const set = [ans], spread = Math.max(3, Math.round(ans*.2)+2);
  let guard = 0;
  while(set.length < 4 && guard++ < 200){
    const v = ans + (Math.random()<.5 ? -1 : 1) * r(1, spread);
    if(v >= 0 && !set.includes(v)) set.push(v);
  }
  while(set.length < 4) set.push(ans + set.length*7);
  return shuffle(set);
}
const qtext = p => `${p.a} ${SYM[p.op]} ${p.b} = ?`;

/* ================= visual models ================= */
function dotsSvg(groups){
  let i = 0, out = '';
  groups.forEach(([n, c, x])=>{ for(let k=0;k<n;k++){
    const col = i%10, cx = 12 + col*22 + (col>=5?8:0), cy = 12 + Math.floor(i/10)*26;
    out += `<circle cx="${cx}" cy="${cy}" r="9" fill="${c}" ${x?'opacity=".4"':''}/>`;
    if(x) out += `<path d="M${cx-6} ${cy-6}L${cx+6} ${cy+6}M${cx+6} ${cy-6}L${cx-6} ${cy+6}" stroke="#d94a3c" stroke-width="3" stroke-linecap="round"/>`;
    i++; }});
  const rows = Math.ceil(i/10) || 1, w = 10*22 + 10;
  return `<svg viewBox="0 0 ${w} ${rows*26}" width="${w}" height="${rows*26}" role="img" aria-label="dot model">${out}</svg>`;
}
function arraySvg(rows, cols){
  let out = '';
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) out += `<circle cx="${11+x*22}" cy="${11+y*22}" r="8.5" fill="${y%2?'#9b6bff':'#7b5cff'}"/>`;
  return `<svg viewBox="0 0 ${cols*22} ${rows*22}" width="${cols*22}" height="${rows*22}" role="img" aria-label="${rows} rows of ${cols}">${out}</svg>`;
}
function blocksSvg(a, b, op){
  let x = 0, out = '';
  const draw = (n, c) => {
    const t = Math.floor(n/10), o = n%10;
    for(let i=0;i<t;i++){ out += `<rect x="${x}" y="0" width="11" height="60" rx="2" fill="${c}"/>`;
      for(let j=1;j<10;j++) out += `<line x1="${x}" x2="${x+11}" y1="${j*6}" y2="${j*6}" stroke="#fff" stroke-opacity=".5"/>`; x += 14; }
    for(let k=0;k<o;k++){ const cx = x + Math.floor(k/5)*14, cy = 60 - (k%5+1)*12; out += `<rect x="${cx}" y="${cy+1}" width="11" height="11" rx="2" fill="${c}"/>`; }
    x += Math.ceil(o/5)*14;
  };
  draw(a, '#4d8cff'); x += 6;
  out += `<text x="${x+8}" y="40" font-family="Fredoka" font-size="26" fill="#6c6890" text-anchor="middle">${SYM[op]}</text>`; x += 22;
  draw(b, op==='+' ? '#ff9f43' : '#ff6b5b');
  return `<svg viewBox="0 0 ${x} 60" width="${x}" height="60" role="img" aria-label="tens and ones blocks">${out}</svg>`;
}
function model(p){
  const {a, b, op} = p;
  if(op==='+' && a+b <= 20) return dotsSvg([[a,'#4d8cff'],[b,'#ff9f43']]);
  if(op==='-' && a <= 20)   return dotsSvg([[a-b,'#4d8cff'],[b,'#ff6b5b',true]]);
  if(op==='×' && a<=10 && b<=10 && a*b<=60) return arraySvg(a, b);
  if(op==='÷' && a<=40) return arraySvg(a/b, b);
  if((op==='+'||op==='-') && a<=99 && b<=99) return blocksSvg(a, b, op);
  return '';
}

function balloonLoop(t){

  mix:  {name:'Mixed facts',       icon:'★', color:'#d94784', specs:[{op:'+',max:20},{op:'-',max:20},{op:'×',facs:ALL,max:10},{op:'÷',facs:ALL,max:10}]}
};
const BOTS = ['Maya','Leo','Aria','Kai','Zoe','Omar','Ivy','Theo','Nina','Ravi','Luca','Mila','Sam','Yuki','Ada','Finn'];
const comboMult = s => s >= 10 ? 3 : s >= 5 ? 2 : 1;
const speedBonus = t => Math.max(0, Math.min(50, Math.round(62 - t*12)));
const byScore = (a, b) => b.score - a.score || (a.you ? -1 : b.you ? 1 : 0);

let AC;
function beep(freq, dur=.09, type='sine', vol=.07){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
  }catch(e){}
}

function renderArena(){
  stop(); tab = 'arena'; setChrome(true); renderTop(); markTab(); window.scrollTo(0,0);
  const today = S.daily[dayKey()];

function startArena(skillId, daily=false){
  stop(); window.scrollTo(0,0); setChrome(false);
  const skill = SKILLS[skillId], dur = daily ? 60 : S.dur;
  // rivals are paced around this player's own speed on the skill, so races stay close
  const rate = S.rate[skillId] || .28, ids = Object.keys(CHARS), factors = shuffle([.65,.8,.95,1.1,1.3]);
  const players = [{you:true, name:'You', char:S.char, score:0}].concat(shuffle(BOTS.slice()).slice(0,5).map((name, i)=>{
    const gap = Math.max(1.1, 1/(rate*factors[i])), first = gap*(.6 + Math.random()*.8) + .4;
    return {name, char:pick(ids), score:0, streak:0, gap, acc:.8 + Math.random()*.17, cur:first, next:first};
  }));
  G = {kind:'arena', alive:true, phase:'lobby', skillId, skill, daily, dur, left:dur, players, me:players[0],
    score:0, correct:0, wrong:0, streak:0, bestStreak:0, typed:'', misses:[], rng: daily ? seeded(hash('daily' + dayKey())) : null};
  view.innerHTML = `<div class="lobby"><h1>${daily ? 'Daily challenge' : skill.name}</h1>
    <p id="lob">Finding players…</p><div class="joined" id="joined"></div><div id="cd"></div></div>`;

  players.forEach((p, i)=>setTimeout(()=>{ if(G !== tok) return;
    $('#joined').insertAdjacentHTML('beforeend', `<div class="pl ${p.you?'you':''}">${charSVG(p.char)}${p.name}</div>`); beep(520 + i*60, .06); }, i*380));
  setTimeout(()=>{ if(G === tok) countdown(3); }, players.length*380 + 400);
}
function countdown(n){
  const tok = G;
  $('#lob').textContent = 'Get ready!';
  $('#cd').innerHTML = `<div class="count">${n || 'Go!'}</div>`;
  beep(n ? 440 : 880, n ? .12 : .25, 'triangle', .09);

}
function arenaPlay(){
  G.phase = 'play';
  view.innerHTML = `<div class="play live">
    <div class="playtop"><button class="x" data-act="arena" aria-label="Leave">✕</button>
      <div class="prog clock"><i id="tm" style="width:100%"></i></div><span class="secs" id="secs">${G.dur}</span></div>
    <div class="board" id="board" style="--n:${G.players.length}">${G.players.map(p=>`<div class="lb ${p.you?'you':''}"><span class="rk"></span>${charSVG(p.char)}<span class="nm">${p.name}</span><span class="pt">0</span></div>`).join('')}</div>
    <div class="scorebar"><span class="score" id="sc">0 points</span><span class="pill fire" id="combo" hidden></span></div>
    <div class="qcard liveq" id="lqc"><div class="qtext"><span id="lq"></span> <span class="box" id="typed"></span></div>

    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button class="key" data-act="key" data-v="${k}">${k}</button>`).join('')}
      <button class="key del" data-act="key" data-v="del" aria-label="Delete">⌫</button><button class="key" data-act="key" data-v="0">0</button><button class="key go" data-act="key" data-v="ok" aria-label="Check">✓</button></div>
  </div>`;
  arenaQ(); drawBoard();
  G.tick = 0; G.last = performance.now(); requestAnimationFrame(arenaLoop);

function arenaQ(){
  let q, guard = 0;
  if(G.rng) RNG = G.rng;
  do q = problem(pick(G.skill.specs)); while(G.q && qtext(q) === qtext(G.q) && guard++ < 5);
  RNG = Math.random;
  G.q = q; G.typed = ''; G.busy = false; G.qStart = G.dur - G.left;
  $('#lq').textContent = `${q.a} ${SYM[q.op]} ${q.b} =`;
  const box = $('#typed'); box.className = 'box'; box.textContent = '';
  $('#hint').textContent = '';
}
function arenaKey(k){
  if(!G || G.kind !== 'arena' || G.phase !== 'play' || G.busy) return;
  if(k === 'ok'){ if(G.typed) arenaCheck(); return; }
  if(k === 'del') G.typed = G.typed.slice(0, -1);
  else if(G.typed.length < 3) G.typed = (G.typed + k).replace(/^0+(?=\d)/, '');
  $('#typed').textContent = G.typed;
  if(G.typed && +G.typed === G.q.ans) arenaCheck(); // right answers go through without pressing ✓
}
function arenaCheck(){
  const tok = G, box = $('#typed');
  G.busy = true;
  if(+G.typed !== G.q.ans) return arenaMiss(true);
  G.correct++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak);
  const pts = Math.round((100 + speedBonus(G.dur - G.left - G.qStart)) * comboMult(G.streak));
  G.score += pts; G.me.score = G.score;
  box.classList.add('ok'); beep(620 + Math.min(G.streak, 12)*35, .1);
  const g = document.createElement('div'); g.className = 'gain'; g.textContent = `+${pts}`;
  $('#lqc').appendChild(g); setTimeout(()=>g.remove(), 800);
  arenaScore();
  setTimeout(()=>{ if(G === tok && G.phase === 'play') arenaQ(); }, 220);
}
function arenaMiss(typed){
  const tok = G, fact = `${G.q.a} ${SYM[G.q.op]} ${G.q.b} = ${G.q.ans}`;
  G.busy = true; G.wrong++; G.streak = 0;
  if(!G.misses.includes(fact)) G.misses.push(fact);
  if(typed) $('#typed').classList.add('no');
  $('#hint').textContent = `${typed ? 'Not quite. ' : ''}${fact}`;
  beep(170, .18, 'square', .04); arenaScore();
  setTimeout(()=>{ if(G === tok && G.phase === 'play') arenaQ(); }, 1000);
}
function arenaScore(){
  $('#sc').textContent = `${G.score} points`;
  const c = $('#combo'), m = comboMult(G.streak);
  c.hidden = G.streak < 2;
  c.textContent = `🔥 ${G.streak} in a row${m > 1 ? ` · ×${m}` : ''}`;
}
function drawBoard(){
  const order = G.players.slice().sort(byScore), rows = $('#board').children;
  G.players.forEach((p, i)=>{
    const rank = order.indexOf(p), row = rows[i];
    row.style.transform = `translateY(calc(${rank} * var(--rh)))`;
    row.querySelector('.rk').textContent = rank + 1;
    row.querySelector('.pt').textContent = p.score;
  });
}
function arenaLoop(t){
  if(!G || G.kind !== 'arena' || !G.alive) return;
  const dt = Math.min(.05, (t - G.last)/1000); G.last = t;
  G.left = Math.max(0, G.left - dt);
  G.players.forEach(p=>{
    if(p.you || (p.next -= dt) > 0) return;
    if(Math.random() < p.acc){ p.streak++; p.score += Math.round((100 + speedBonus(p.cur)) * comboMult(p.streak)); }
    else p.streak = 0;
    p.cur = p.next = p.gap * (.6 + Math.random()*.8);
  });
  if((G.tick += dt) > .2){ G.tick = 0; drawBoard(); }
  $('#tm').style.width = (G.left/G.dur*100) + '%';
  const s = $('#secs'), sec = Math.ceil(G.left);
  if(s.textContent != sec){ s.textContent = sec; s.classList.toggle('low', sec <= 10); if(sec <= 5 && sec > 0) beep(990, .05, 'sine', .05); }
  if(G.left <= 0) return arenaEnd();
  requestAnimationFrame(arenaLoop);
}
function arenaEnd(){
  const tok = G;
  G.alive = false; G.phase = 'end'; drawBoard();
  $('#sheet').innerHTML = `<div class="timesup">Time's up!</div>`;
  beep(330, .35, 'triangle', .09);
  setTimeout(()=>{ closeSheet(); if(G === tok) arenaResult(); }, 1100);
}
function arenaResult(){
  const g = G, ranked = g.players.slice().sort(byScore), place = ranked.indexOf(g.me) + 1, today = dayKey();
  const key = `${g.skillId}-${g.dur}`, prev = g.daily ? S.daily[today] : S.best[key], firstDaily = g.daily && prev == null;
  const pb = g.score > 0 && (prev == null || g.score > prev);
  if(pb){ if(g.daily) S.daily[today] = g.score; else S.best[key] = g.score; }
  const rate = g.correct / g.dur, old = S.rate[g.skillId];
  S.rate[g.skillId] = Math.max(.08, old ? old*.6 + rate*.4 : rate);
  S.games++;
  const res = grant(5 + Math.round(g.correct*1.5) + ([20,12,8][place-1] || 0) + (firstDaily ? 30 : 0), 10 + g.correct*4);
  const tries = g.correct + g.wrong, acc = tries ? Math.round(g.correct/tries*100) : 0;
  stop(); setChrome(false); window.scrollTo(0,0);
  view.innerHTML = `<div class="result">
    <h1>${place === 1 ? 'You won! 🏆' : `${ord(place)} place${place <= 3 ? '!' : ''}`}</h1>
    <p class="muted">${g.correct} right in ${g.dur/60} minute${g.dur > 60 ? 's' : ''}. ${place === 1 ? 'Nobody was faster!' : place <= 3 ? 'You made the podium.' : 'Keep a streak going to climb higher.'}</p>
    <div class="podium">${[1,0,2].map(i=>{ const p = ranked[i];
      return `<div class="pod p${i+1} ${p.you?'you':''}">${charSVG(p.char, p.you ? 'class="bob"' : '')}<span class="nm">${p.name}</span><span class="muted">${p.score}</span><div class="blk">${i+1}</div></div>`; }).join('')}</div>
    ${pb ? `<div class="badge">${g.daily ? 'Best daily score today!' : 'New personal best!'}</div>` : ''}
    <div class="statgrid wide">
      <div class="stat"><b>${g.score}</b><span>Points</span></div>
      <div class="stat"><b>${g.correct}</b><span>Right</span></div>
      <div class="stat"><b>${acc}%</b><span>Accuracy</span></div>
      <div class="stat"><b>${g.bestStreak}</b><span>Best streak</span></div>
    </div>
    <div class="rewards"><span class="pill">🪙 +${res.coins}</span><span class="pill xpp">⚡ +${res.xp} XP</span></div>
    ${res.up ? `<div class="lvlup">Level up! You're level ${S.level}</div>` : ''}
    ${g.misses.length ? `<p class="muted">Practice these next time:</p><div class="review">${g.misses.slice(0, 8).map(m=>`<span>${m}</span>`).join('')}</div>` : ''}
    <div class="stack" style="margin-top:6px;max-width:420px">
      <button class="btn green" data-act="${g.daily ? 'daily' : 'arena-go'}" data-v="${g.skillId}">Play again</button>
      <button class="btn ghost" data-act="arena">Back to arena</button>
    </div></div>`;
  if(place <= 3) confetti();
}

/* ================= crew ================= */
function renderCrew(){
  stop(); tab = 'crew'; setChrome(true); renderTop(); markTab(); window.scrollTo(0,0);
  const doneCount = Object.keys(S.done).length;
  view.innerHTML = `<section class="page">
    <h1>Your crew</h1>
    <p class="muted">Pick a buddy to explore the map with you. Earn coins in lessons and games to unlock more friends.</p>
    <div class="statgrid">
      <div class="stat"><b>${doneCount}/${NODES.length}</b><span>Steps done</span></div>
      <div class="stat"><b>${totalStars()}</b><span>Stars</span></div>
      <div class="stat"><b>${S.coins}</b><span>Coins</span></div>
      <div class="stat"><b>${S.games}</b><span>Arena games</span></div>
      <div class="stat"><b>${Math.max(0, ...Object.values(S.best), ...Object.values(S.daily))}</b><span>Best score</span></div>
      <div class="stat"><b>${dayStreak()}</b><span>Day streak</span></div>
    </div>
    <div class="crew">${Object.entries(CHARS).map(([id, c])=>{
      const own = S.owned.includes(id), sel = S.char === id;
      const btn = sel ? `<button class="btn sm ghost" disabled>With you</button>`
        : own ? `<button class="btn sm" data-act="pickc" data-v="${id}">Choose</button>`
        : `<button class="btn sm gold" data-act="buyc" data-v="${id}" ${S.coins < c.price ? 'disabled' : ''}>🪙 ${c.price}</button>`;
      return `<div class="cc ${sel?'sel':''}">${charSVG(id)}<h3>${c.name}</h3><p>${c.bio}</p>${btn}</div>`;
    }).join('')}</div></section>`;
}

/* ================= events ================= */
document.addEventListener('click', e=>{
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ ({map:renderMap, arena:renderArena, crew:renderCrew})[tabBtn.dataset.tab](); return; }
  const node = e.target.closest('[data-node]');
  if(node){ openSheet(node.dataset.node); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a === 'close'){ if(e.target === el || el.tagName === 'BUTTON') closeSheet(); return; }
  if(a === 'welcomed'){ S.seen = true; save(); closeSheet(); return; }
  if(a === 'start') return startNode(v);
  if(a === 'quit' || a === 'tomap') return renderMap();
  if(a === 'practice') return lessonQ();
  if(a === 'ans') return answerLesson(el);
  if(a === 'next') return lessonNext();
  if(a === 'pop') return popBalloon(el);
  if(a === 'race') return answerRace(el);
  if(a === 'boss') return answerBoss(el);
  if(a === 'arena') return renderArena();
  if(a === 'arena-go') return startArena(v);
  if(a === 'daily') return startArena('mix', true);
  if(a === 'dur'){ S.dur = +v; save(); return renderArena(); }
  if(a === 'sound'){ S.sound = !S.sound; save(); return renderArena(); }
  if(a === 'key') return arenaKey(v);
  if(a === 'skip'){ if(G && G.kind === 'arena' && G.phase === 'play' && !G.busy) arenaMiss(false); return; }
  if(a === 'pickc'){ S.char = v; save(); return renderCrew(); }
  if(a === 'buyc'){ const c = CHARS[v]; if(S.coins < c.price) return;
    S.coins -= c.price; S.owned.push(v); S.char = v; save(); toast(`${c.name} joined your crew!`); return renderCrew(); }
});
document.addEventListener('keydown', e=>{
  if(G && G.kind === 'arena'){
    const k = /^[0-9]$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'del' : e.key === 'Enter' ? 'ok' : null;
    if(!k || (k === 'ok' && e.target.closest && e.target.closest('.x'))) return;
    e.preventDefault(); return arenaKey(k);
  }
  if(!G || !/^[1-4]$/.test(e.key)) return;
  const btn = view.querySelectorAll('.ans')[+e.key - 1];
  if(btn && !btn.disabled) btn.click();
});

renderMap();
</script>
</body>
</html>
