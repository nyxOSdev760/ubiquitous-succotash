<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Math</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4675078529012990"
     crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#23204a; --muted:#6c6890; --bg:#eef1ff; --card:#fff; --line:#e3e1f5;
  --sea1:#63cdf5; --sea2:#2f8fe0;
  --violet:#7b5cff; --violet-d:#5a3fd6;
  --green:#2fc16a; --green-d:#1f9650;
  --coral:#ff6b5b; --coral-d:#d94a3c;
  --gold:#ffc83d; --gold-d:#d9a10f;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#3a24a6;background:radial-gradient(circle at 50% -10%,#7b5cff 0,transparent 60%) fixed,linear-gradient(170deg,#4a2fc0,#24166a) fixed;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.f{font-family:Fredoka,Nunito,sans-serif;font-weight:600}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
[hidden]{display:none!important}
.muted{color:var(--muted)}

#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}

/* shared bits */
.xp{height:9px;background:#e8e5fb;border-radius:9px;overflow:hidden;margin-top:5px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#7b5cff,#5ec8f2);border-radius:9px;transition:width .6s}
.pill{display:inline-flex;align-items:center;gap:5px;background:#fff4d6;color:#7a5000;font-weight:800;padding:6px 11px;border-radius:999px;font-size:.92rem;white-space:nowrap}
.pill.star{background:#fff0f7;color:#a3215c}
.pill.xpp{background:#eeeaff;color:#4b33c2}
@keyframes ping{50%{transform:scale(1.25)}}
.has::after{content:"";position:absolute;top:-2px;right:6px;width:14px;height:14px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px #fff;animation:ping 1.4s ease-in-out infinite}

/* page header */
.phead{display:flex;align-items:center;gap:12px;margin-bottom:16px;color:#fff}
.phead h1{flex:1;min-width:0;font-size:1.7rem;line-height:1.1;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.back{width:46px;height:46px;flex:none;border:0;border-radius:15px;background:#fff;color:var(--ink);font-size:1.4rem;font-weight:800;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}

/* zone path */
.zone{min-height:100vh;min-height:100dvh;padding:14px 16px 130px;background:linear-gradient(180deg,var(--z1),var(--z2))}
.zone svg.path{display:block;width:100%;height:auto;margin-top:-6px}
.zone .phead .pill{box-shadow:0 3px 0 rgba(0,0,0,.15)}
.node{cursor:pointer}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{from{transform:scale(1);opacity:.75}to{transform:scale(1.55);opacity:0}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.wave{animation:drift 6s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(14px)}}

/* buttons */
.btn{display:block;width:100%;border:0;border-radius:18px;padding:16px;font-family:Fredoka;font-weight:600;font-size:1.2rem;color:#fff;
  background:var(--c,var(--violet));box-shadow:0 5px 0 var(--d,var(--violet-d));transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--d,var(--violet-d))}
.btn:disabled{opacity:.5;cursor:default}
.btn.green{--c:var(--green);--d:var(--green-d)}
.btn.coral{--c:var(--coral);--d:var(--coral-d)}
.btn.gold{--c:var(--gold);--d:var(--gold-d);color:#4a3200}
.btn.ghost{--c:#fff;--d:#d9d5ef;color:var(--ink)}
.btn.sm{padding:10px;font-size:1rem;border-radius:14px}
.stack{display:flex;flex-direction:column;gap:14px;width:100%}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(35,32,74,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:28px 28px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;animation:up .28s ease-out}
.sheet .ico{font-size:3.2rem;line-height:1}
.sheet h2{font-size:1.65rem;margin:8px 0 6px}
.sheet p{margin-bottom:18px;line-height:1.45}
.sheet .who{width:110px;height:110px;margin:0 auto}
.tag{display:inline-block;font-weight:800;font-size:.8rem;padding:4px 11px;border-radius:999px;color:#fff;margin-top:10px}
.sstars{font-size:1.6rem;color:var(--gold);letter-spacing:3px;margin-bottom:12px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}

/* play screens */
.play{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.playtop{display:flex;align-items:center;gap:12px}
.x{width:42px;height:42px;border-radius:13px;border:0;background:#fff;font-size:1.2rem;color:var(--muted);box-shadow:0 3px 0 rgba(20,10,60,.22);flex:none}
.prog{flex:1;height:16px;background:rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .4s}
.coach{display:flex;align-items:flex-end;gap:10px}
.coach svg{width:66px;height:66px;flex:none}
.bubble{background:#fff;border-radius:18px 18px 18px 4px;padding:11px 15px;font-weight:800;box-shadow:0 3px 0 rgba(20,10,60,.22);line-height:1.35}
.qcard{background:#fff;border-radius:24px;padding:22px 16px;text-align:center;box-shadow:0 6px 0 rgba(20,10,60,.22)}
.qcard.slim{padding:14px}
.qtext{font-family:Fredoka;font-weight:600;font-size:clamp(2.5rem,12vw,3.5rem);line-height:1.1}
.qtext.md{font-size:clamp(2rem,10vw,2.8rem)}
.model{margin-top:16px;display:flex;justify-content:center}
.model svg{max-width:100%;height:auto}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:auto}
.ans{border:0;border-radius:20px;padding:20px 0;font-family:Fredoka;font-weight:600;font-size:2rem;color:#fff;background:var(--c);box-shadow:0 6px 0 var(--d);transition:transform .06s,box-shadow .06s,opacity .2s}
.ans:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.ans:nth-child(1){--c:#4d8cff;--d:#2f67d6}
.ans:nth-child(2){--c:#9b6bff;--d:#7445e0}
.ans:nth-child(3){--c:#ff6fa8;--d:#d94784}
.ans:nth-child(4){--c:#ffab3d;--d:#d9861a}
.ans.right{--c:var(--green);--d:var(--green-d)}
.ans.wrong{--c:var(--coral);--d:var(--coral-d);animation:shake .35s}
.ans.dim{opacity:.35}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

.teach{background:#fff;border-radius:24px;padding:20px;box-shadow:0 6px 0 rgba(20,10,60,.22)}
.teach h2{font-size:1.6rem;margin:8px 0 6px}
.teach p{line-height:1.5;font-size:1.05rem}
.example{margin-top:16px;padding:16px;border-radius:18px;background:#f5f3ff;text-align:center}
.example .qtext{font-size:2.2rem}

/* results */
.result{min-height:100vh;color:var(--ink);min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:28px 20px;
  background:radial-gradient(circle at 50% 30%,#fff 0,#eef1ff 60%)}
.result svg.big{width:150px;height:150px}
.result h1{font-size:2.1rem}
.stars{font-size:3.2rem;letter-spacing:8px;line-height:1}
.stars span{color:#dcd8ee;display:inline-block}
.stars span.on{color:var(--gold);animation:popin .45s backwards;text-shadow:0 3px 0 var(--gold-d)}
@keyframes popin{from{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}}
.rewards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lvlup{background:var(--violet);color:#fff;font-weight:800;padding:10px 16px;border-radius:14px}

/* balloon game */
.sky{position:relative;flex:1;min-height:400px;border-radius:24px;overflow:hidden;background:linear-gradient(#bde8ff,#eef9ff);box-shadow:inset 0 0 0 3px #fff}
.cloud{position:absolute;font-size:2.4rem;opacity:.9}
.balloon{position:absolute;top:0;width:74px;height:88px;border:0;border-radius:50% 50% 47% 47%/56% 56% 44% 44%;
  display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:1.6rem;color:#fff;box-shadow:inset -9px -10px 0 rgba(0,0,0,.13);will-change:transform}
.balloon::before{content:"";position:absolute;bottom:-6px;left:50%;margin-left:-6px;border:6px solid transparent;border-bottom:8px solid currentColor;filter:brightness(.8);color:inherit;opacity:0}
.balloon::after{content:"";position:absolute;bottom:-38px;left:50%;width:2px;height:36px;background:rgba(35,32,74,.3)}
.balloon.pop{animation:popb .25s forwards}
.balloon.bad{animation:shake .35s;opacity:.4}
@keyframes popb{to{scale:1.6;opacity:0}}

/* race */
.track{background:#fff;border-radius:24px;padding:14px;box-shadow:0 6px 0 rgba(20,10,60,.22)}
.lane{position:relative;height:72px;border-radius:16px;margin:6px 0;background:repeating-linear-gradient(90deg,#f3f1fc 0 22px,#e9e6f8 22px 44px)}
.finish{position:absolute;right:0;top:0;bottom:0;width:16px;border-radius:0 16px 16px 0;
  background:repeating-conic-gradient(#23204a 0 25%,#fff 0 50%) 0 0/8px 8px}
.racer{position:absolute;top:4px;left:0;width:64px;height:64px;transition:left .35s ease-out}
.racer svg{width:100%;height:100%}
#rv{transition:none}
.lanelabel{position:absolute;left:10px;bottom:4px;font-size:.75rem;font-weight:800;color:var(--muted)}

/* boss */
.arena{position:relative;border-radius:24px;padding:16px;color:#fff;background:linear-gradient(#3b2a6b,#6243b8);box-shadow:0 6px 0 #2a1d50;overflow:hidden}
.arena.hurt{animation:hurt .4s}
@keyframes hurt{30%{box-shadow:0 6px 0 #2a1d50,inset 0 0 0 200px rgba(255,80,80,.35)}}
.bossrow{display:flex;justify-content:space-between;align-items:center;font-family:Fredoka;font-weight:600}
.hp{height:14px;background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden;margin:8px 0 4px}
.hp i{display:block;height:100%;background:linear-gradient(90deg,#ff5b7a,#ffb03d);border-radius:9px;transition:width .4s}
.mon{width:150px;height:150px;margin:6px auto 0;position:relative}
.mon svg{width:100%;height:100%}
.mon.hit{animation:hit .4s}
@keyframes hit{25%{transform:translateX(10px) rotate(6deg);filter:brightness(2)}60%{transform:translateX(-6px)}}
.me{display:flex;align-items:center;gap:8px}
.me svg{width:48px;height:48px}
.hearts{font-size:1.3rem;letter-spacing:2px}
.dmg{position:absolute;left:50%;top:40%;font-family:Fredoka;font-weight:700;font-size:2.2rem;color:#ffe066;text-shadow:0 3px 0 #a3215c;animation:rise .8s forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-50px);opacity:0}}
.qtimer{height:10px;background:rgba(255,255,255,.22);border-radius:9px;overflow:hidden}
.qtimer i{display:block;height:100%;background:var(--violet);border-radius:9px}

/* crew */
.page{min-height:100vh;min-height:100dvh;padding:14px 16px 40px}
.page > p{margin:6px 0 18px;line-height:1.45;color:rgba(255,255,255,.8)}
.crew{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cc{background:#fff;border-radius:22px;padding:14px;text-align:center;box-shadow:0 5px 0 rgba(20,10,60,.22);border:3px solid transparent;display:flex;flex-direction:column;gap:6px}
.cc.sel{border-color:var(--violet)}
.cc svg{width:96px;height:96px;margin:0 auto}
.cc h3{font-size:1.25rem}
.cc p{font-size:.85rem;color:var(--muted);flex:1}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:0 4px 0 rgba(20,10,60,.22)}
.stat b{display:block;font-family:Fredoka;font-weight:600;font-size:1.6rem}
.stat span{font-size:.8rem;color:var(--muted);font-weight:800}

.statgrid.wide{grid-template-columns:repeat(4,1fr);width:100%;max-width:420px;margin-bottom:0}
.statgrid.wide b{font-size:1.3rem}

/* speed arena */
.pill.fire{background:#ffe9e0;color:#b33a12}
.page h2{font-size:1.3rem;margin:22px 0 10px;color:#fff}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 18px 18px;color:#fff;
  background:radial-gradient(circle at 90% -10%,#8d6bff 0,transparent 55%),linear-gradient(160deg,#33227a,#1b1442);box-shadow:0 6px 0 #120c30}
.hero::after{content:"⚡";position:absolute;right:-14px;bottom:-30px;font-size:9rem;opacity:.08;transform:rotate(12deg);pointer-events:none}
.hero p{margin:0 48px 14px 0;font-weight:700;opacity:.8;line-height:1.4;max-width:22em}
.sound{position:absolute;top:16px;right:16px;z-index:1;border:0;width:40px;height:40px;border-radius:12px;font-size:1.1rem;background:rgba(255,255,255,.12);color:#fff}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:14px;padding:4px;position:relative;z-index:1}
.seg button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px;font-weight:800;color:rgba(255,255,255,.75)}
.seg button.on{background:#fff;color:#33227a;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.daily{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;border:0;text-align:left;color:#fff;border-radius:22px;padding:16px;
  background:linear-gradient(135deg,#ffb432,#ff6d5a);box-shadow:0 5px 0 #c4472f}
.daily:active,.sk:active{transform:translateY(3px);box-shadow:0 2px 0 var(--sh)}
.daily{--sh:#c4472f}
.daily .big{font-size:2.3rem;line-height:1;flex:none}
.daily .txt{flex:1;min-width:0}
.daily b{display:block;font-family:Fredoka;font-weight:600;font-size:1.25rem;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.daily small{display:block;font-weight:800;font-size:.85rem;opacity:.95}
.daily .go{flex:none;background:#fff;color:#d2512f;font-family:Fredoka;font-weight:600;padding:8px 14px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.daily.done .go{background:rgba(255,255,255,.25);color:#fff;box-shadow:none}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sk{--sh:color-mix(in srgb,var(--c),#000 35%);position:relative;overflow:hidden;min-height:112px;border:0;border-radius:22px;padding:14px;text-align:left;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c),#fff 12%),color-mix(in srgb,var(--c),#000 12%));box-shadow:0 5px 0 var(--sh);
  display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.sk .si{position:absolute;right:-4px;bottom:-30px;font-family:Fredoka;font-weight:700;font-size:6.5rem;line-height:1;opacity:.22;pointer-events:none}
.sk b{position:relative;font-family:Fredoka;font-weight:600;font-size:1.15rem;line-height:1.2;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.sk small{position:relative;align-self:flex-start;font-weight:800;font-size:.78rem;background:rgba(0,0,0,.2);padding:4px 10px;border-radius:999px}

.lobby{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px 18px;text-align:center;color:#fff;
  background:radial-gradient(circle at 50% -10%,#6243d8 0,transparent 60%),linear-gradient(#1b1442,#2a1d63)}
.lobby h1{font-size:1.9rem}
.lobby p{font-weight:800;opacity:.8}
.joined{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:360px}
.pl{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);border-radius:18px;padding:10px 6px;font-weight:800;font-size:.92rem;animation:popin .4s backwards}
.pl svg{width:54px;height:54px;display:block;margin:0 auto 4px}
.pl.you{background:rgba(123,92,255,.35);box-shadow:inset 0 0 0 3px #ffe066}
.count{font-family:Fredoka;font-weight:700;font-size:6.5rem;line-height:1;color:#ffe066;text-shadow:0 6px 0 #a3215c;animation:popin .45s}
#cd{min-height:6.5rem}

.live{gap:12px;color:#fff;background:radial-gradient(circle at 50% -10%,#5a3fd6 0,transparent 60%),linear-gradient(#1b1442,#2a1d63)}
.hud{display:flex;align-items:center;gap:12px}
.live .x{background:rgba(255,255,255,.12);color:#fff;box-shadow:none}
.hudscore{flex:1;text-align:center;line-height:1}
.hudscore b{display:block;font-family:Fredoka;font-weight:700;font-size:2rem;font-variant-numeric:tabular-nums}
.hudscore span{font-size:.75rem;font-weight:800;opacity:.65;letter-spacing:.08em;text-transform:uppercase}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .trk{stroke:rgba(255,255,255,.14)}
.ring #tm{stroke:#ffc83d;stroke-linecap:round;stroke-dasharray:119.4}
.ring.low #tm{stroke:#ff6b5b}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-family:Fredoka;font-weight:600;font-size:1.15rem}
.ring.low span{color:#ff8d80}
.board{--rh:28px;position:relative;height:calc(var(--n) * var(--rh) + 8px);border-radius:18px;overflow:hidden;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.lb{position:absolute;top:4px;left:5px;right:5px;height:var(--rh);display:flex;align-items:center;gap:8px;padding:0 9px;border-radius:10px;font-weight:800;font-size:.9rem;transition:transform .45s ease}
.lb.you{z-index:1;background:linear-gradient(90deg,#7b5cff,#5a3fd6);box-shadow:0 0 0 2px #a991ff,0 0 16px rgba(123,92,255,.55)}
.lb .rk{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:.72rem;background:rgba(255,255,255,.14);flex:none}
.lb[data-rank="1"] .rk{background:#ffc83d;color:#5a3a00}
.lb[data-rank="2"] .rk{background:#cfd6ea;color:#33405c}
.lb[data-rank="3"] .rk{background:#e8a57a;color:#5a2a0c}
.lb svg{width:22px;height:22px;flex:none}
.lb .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .pt{font-variant-numeric:tabular-nums}
.qcard.liveq{position:relative;flex:1;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:18px 12px 10px;color:#fff;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.liveq .qtext{text-shadow:0 4px 0 rgba(0,0,0,.25)}
.liveq.ok{animation:okflash .35s}
.liveq.no{animation:noflash .45s}
@keyframes okflash{30%{box-shadow:inset 0 0 0 3px #2fc16a,0 0 34px rgba(47,193,106,.45)}}
@keyframes noflash{30%{box-shadow:inset 0 0 0 3px #ff6b5b,0 0 34px rgba(255,107,91,.4)}}
.combo{position:absolute;top:10px;left:12px;font-weight:800;font-size:.85rem;padding:5px 11px;border-radius:999px;color:#fff;background:linear-gradient(90deg,#ff8a3d,#ff4f6d);box-shadow:0 0 14px rgba(255,100,80,.5);animation:popin .3s}
.box{display:inline-block;min-width:1.7em;padding:0 .15em;border-radius:16px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 3px rgba(255,255,255,.3);text-shadow:none}
.box:empty::after{content:"";display:inline-block;width:3px;height:.85em;background:#fff;vertical-align:-.06em;animation:blink 1s steps(1) infinite}
.box.ok{background:#2fc16a;box-shadow:0 0 24px rgba(47,193,106,.7)}
.box.no{background:#ff6b5b;box-shadow:0 0 24px rgba(255,107,91,.6);animation:shake .35s}
@keyframes blink{50%{opacity:0}}
.hint{min-height:1.5em;font-weight:800;color:#ffb4aa}
.skip{border:0;background:none;color:rgba(255,255,255,.55);font-weight:800;font-size:.9rem;text-decoration:underline;padding:4px 10px}

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const view = $('#view');
let RNG = Math.random; // swapped for a seeded generator while building the daily challenge
const r = (a,b) => Math.floor(RNG()*(b-a+1))+a;
const pick = a => a[Math.floor(RNG()*a.length)];
const seeded = s => () => { s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const hash = str => [...str].reduce((h, c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);
const dayKey = (t = Date.now()) => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const ord = n => n + (['th','st','nd','rd'][n] || 'th');
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=r(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ================= math ================= */
function problem(s){
  let a, b, ans;
  const lo = s.min || 1;
  if(s.op==='+' || s.op==='-'){
    const x = r(lo, s.max-lo), y = r(lo, s.max-x);
    if(s.op==='+'){ a=x; b=y; ans=x+y; } else { a=x+y; b=x; ans=y; }
  }
  if(s.op==='×'){ const f = pick(s.facs), o = r(1, s.max); [a,b] = RNG()<.5 ? [f,o] : [o,f]; ans = a*b; }
  if(s.op==='÷'){ b = pick(s.facs); ans = r(1, s.max); a = b*ans; }
  return {a, b, ans, op:s.op};
}
const calc = p => p.op==='+' ? p.a+p.b : p.op==='-' ? p.a-p.b : p.op==='×' ? p.a*p.b : p.a/p.b;
function choices(ans){
  const set = [ans], spread = Math.max(3, Math.round(ans*.2)+2);
  let guard = 0;
  while(set.length < 4 && guard++ < 200){
    const v = ans + (Math.random()<.5 ? -1 : 1) * r(1, spread);
    if(v >= 0 && !set.includes(v)) set.push(v);
  }
  while(set.length < 4) set.push(ans + set.length*7);
  return shuffle(set);
}
const qtext = p => `${p.a} ${SYM[p.op]} ${p.b} = ?`;

/* ================= visual models ================= */
function dotsSvg(groups){
  let i = 0, out = '';
  groups.forEach(([n, c, x])=>{ for(let k=0;k<n;k++){
    const col = i%10, cx = 12 + col*22 + (col>=5?8:0), cy = 12 + Math.floor(i/10)*26;
    out += `<circle cx="${cx}" cy="${cy}" r="9" fill="${c}" ${x?'opacity=".4"':''}/>`;
    if(x) out += `<path d="M${cx-6} ${cy-6}L${cx+6} ${cy+6}M${cx+6} ${cy-6}L${cx-6} ${cy+6}" stroke="#d94a3c" stroke-width="3" stroke-linecap="round"/>`;
    i++; }});
  const rows = Math.ceil(i/10) || 1, w = 10*22 + 10;
  return `<svg viewBox="0 0 ${w} ${rows*26}" width="${w}" height="${rows*26}" role="img" aria-label="dot model">${out}</svg>`;
}
function arraySvg(rows, cols){
  let out = '';
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) out += `<circle cx="${11+x*22}" cy="${11+y*22}" r="8.5" fill="${y%2?'#9b6bff':'#7b5cff'}"/>`;
  return `<svg viewBox="0 0 ${cols*22} ${rows*22}" width="${cols*22}" height="${rows*22}" role="img" aria-label="${rows} rows of ${cols}">${out}</svg>`;
}
function blocksSvg(a, b, op){
  let x = 0, out = '';
  const draw = (n, c) => {
    const t = Math.floor(n/10), o = n%10;
    for(let i=0;i<t;i++){ out += `<rect x="${x}" y="0" width="11" height="60" rx="2" fill="${c}"/>`;
      for(let j=1;j<10;j++) out += `<line x1="${x}" x2="${x+11}" y1="${j*6}" y2="${j*6}" stroke="#fff" stroke-opacity=".5"/>`; x += 14; }
    for(let k=0;k<o;k++){ const cx = x + Math.floor(k/5)*14, cy = 60 - (k%5+1)*12; out += `<rect x="${cx}" y="${cy+1}" width="11" height="11" rx="2" fill="${c}"/>`; }
    x += Math.ceil(o/5)*14;
  };
  draw(a, '#4d8cff'); x += 6;
  out += `<text x="${x+8}" y="40" font-family="Fredoka" font-size="26" fill="#6c6890" text-anchor="middle">${SYM[op]}</text>`; x += 22;
  draw(b, op==='+' ? '#ff9f43' : '#ff6b5b');
  return `<svg viewBox="0 0 ${x} 60" width="${x}" height="60" role="img" aria-label="tens and ones blocks">${out}</svg>`;
}
function model(p){
  const {a, b, op} = p;
  if(op==='+' && a+b <= 20) return dotsSvg([[a,'#4d8cff'],[b,'#ff9f43']]);
  if(op==='-' && a <= 20)   return dotsSvg([[a-b,'#4d8cff'],[b,'#ff6b5b',true]]);
  if(op==='×' && a<=10 && b<=10 && a*b<=60) return arraySvg(a, b);
  if(op==='÷' && a<=40) return arraySvg(a/b, b);
  if((op==='+'||op==='-') && a<=99 && b<=99) return blocksSvg(a, b, op);
  return '';
}

/* ================= chrome ================= */
let tab = 'world', G = null, W = null, lastZone = null;
const esc = str => String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
// every full screen starts here: stops whatever game or world was running
function enter(name, flush=true){
  stop();
  if(W){ if(W.alive){ S.pos = {x:Math.round(W.x), y:Math.round(W.y)}; save(); } W.alive = false; }
  tab = name; window.scrollTo(0,0);
  if(flush) NEWS.splice(0).forEach(toast);
}
const pageHead = (title, back='world') => `<div class="phead"><button class="back" data-act="${back}" aria-label="Back">←</button><h1>${title}</h1><span class="pill">🪙 ${S.coins}</span></div>`;
const goBack = () => lastZone != null ? renderZone(lastZone) : renderWorld();
const coachBox = (text, btn='') => `<div class="coachbox">${charSVG('pip')}<p>${text}</p>${btn}</div>`;
const TQ = [];
function toast(msg){ TQ.push(msg); if(!toast.on) nextToast(); }
function nextToast(){
  const t = $('#toast'), m = TQ.shift();
  toast.on = !!m; t.hidden = !m; if(!m) return;
  t.textContent = m; t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
  setTimeout(nextToast, 1900);
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#ff6b5b','#4d8cff','#ffc83d','#2fc16a','#9b6bff','#ff6fa8'];
  for(let i=0;i<46;i++){
    const s = document.createElement('span'); s.className = 'cf';
    s.style.left = r(0,100)+'vw'; s.style.background = pick(cols);
    s.style.animationDuration = (1.6+Math.random()*1.4)+'s'; s.style.animationDelay = (Math.random()*.4)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(), 3600);
  }
}
const stop = () => { if(G){ G.alive = false; } G = null; };

/* ================= zone path ================= */
function renderZone(wi){
  enter('zone'); lastZone = wi;
  const w = WORLDS[wi], ns = NODES.filter(n => n.wi === wi);
  const cur = ns.find(n => !S.done[n.id] && unlocked(n)) || ns[ns.length-1];
  const VW = 360, xs = [110, 250, 115, 245, 110, 180], gap = 128, top = 70;
  const pts = ns.map((n, i) => ({x:xs[i], y:top + i*gap})), H = top + 5*gap + 120;
  let path = `M${pts[0].x} ${pts[0].y}`;
  for(let i=1;i<pts.length;i++){ const a = pts[i-1], b = pts[i], m = (b.y-a.y)/2; path += ` C${a.x} ${a.y+m} ${b.x} ${b.y-m} ${b.x} ${b.y}`; }
  const decor = pts.map((p, i)=>`<text x="${p.x < 180 ? 318 : 42}" y="${p.y + 40}" text-anchor="middle" font-size="34">${w.decor[i % w.decor.length]}</text>`).join('');
  const nodes = ns.map((n, i)=>{
    const p = pts[i], open = unlocked(n), stars = S.done[n.id] || 0, isCur = n === cur, big = n.type === 'boss';
    const R = big ? 40 : 33, fill = open ? w.node : '#cfcbe3', dk = open ? w.dark : '#a9a4c4';
    const label = big ? w.boss : n.title, lx = p.x < 180 ? p.x + R + 12 : p.x - R - 12, anchor = p.x < 180 ? 'start' : 'end';
    return `<g class="node" data-node="${n.id}" transform="translate(${p.x} ${p.y})" role="button" aria-label="${label}${open ? '' : ' (locked)'}">
      ${isCur ? `<circle r="${R}" fill="#fff" class="pulse"/>` : ''}
      <circle cy="7" r="${R}" fill="${dk}"/>
      <circle r="${R}" fill="${fill}" stroke="${stars ? '#ffc83d' : '#fff'}" stroke-width="5"/>
      ${big && open ? monsterSVG(w.monster, `x="${-R+8}" y="${-R+8}" width="${2*R-16}" height="${2*R-16}"`)
        : `<text y="10" text-anchor="middle" font-size="28" ${open ? '' : 'opacity=".7"'}>${open ? TYPE[n.type].icon : '🔒'}</text>`}
      ${stars ? `<text y="${R+24}" text-anchor="middle" font-size="17" font-weight="800" fill="#ffc83d" stroke="#7a5000" stroke-width=".8">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</text>` : ''}
      ${isCur ? `<g class="bob">${meSVG(`x="-28" y="${-R-58}" width="56" height="56"`)}</g>` : ''}
    </g>
    <text x="${lx}" y="${p.y + 6}" text-anchor="${anchor}" font-family="Fredoka" font-weight="600" font-size="15" fill="#fff" stroke="rgba(20,10,60,.45)" stroke-width="5" paint-order="stroke">${label}</text>`;
  }).join('');
  const stars = ns.reduce((a, n) => a + (S.done[n.id] || 0), 0);
  view.innerHTML = `<div class="zone" style="--z1:${w.sky[0]};--z2:${w.sky[1]}">
    ${pageHead(w.name).replace(`🪙 ${S.coins}`, `⭐ ${stars}/18`).replace('class="pill"', 'class="pill star"')}
    ${S.tut === 4 && wi === 0 ? coachBox('Tap the glowing lesson to start. Lessons teach you, then games let you practice!') : ''}
    <svg class="path" viewBox="0 0 ${VW} ${H}" role="img" aria-label="${w.name} steps">
      ${decor}
      <path d="${path}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 18" opacity=".9"/>
      ${nodes}</svg>
    <button class="cta" data-node="${cur.id}"><span>▶</span><span><small>${S.done[cur.id] ? 'Play again' : 'Play next'}</small>${cur.type === 'boss' ? `Beat ${w.boss}` : cur.title}</span></button></div>`;
}
function openSheet(id){
  const n = NODES.find(x=>x.id===id); if(!n) return;
  if(!unlocked(n)){ toast('Finish the step before this one to unlock it.'); return; }
  const t = TYPE[n.type], stars = S.done[n.id] || 0;
  const title = n.type==='boss' ? `${n.w.boss}` : n.title;
  $('#sheet').innerHTML = `<div class="overlay" data-act="close"><div class="sheet" role="dialog" aria-label="${title}">
    ${n.type==='boss' ? monsterSVG(n.w.monster,'class="who"') : `<div class="ico">${t.icon}</div>`}
    <span class="tag" style="background:${n.w.node}">${t.label}</span>
    <h2>${title}</h2>
    ${stars ? `<div class="sstars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>` : ''}
    <p class="muted">${t.desc}</p>
    <div class="stack"><button class="btn green ${S.tut === 4 ? 'hl' : ''}" data-act="start" data-v="${n.id}">${stars ? 'Play again' : 'Start'}</button>
    <button class="btn ghost" data-act="close">Not now</button></div></div></div>`;
}
const closeSheet = () => $('#sheet').innerHTML = '';

function startNode(id){
  closeSheet(); enter('play');
  const n = NODES.find(x=>x.id===id);
  if(S.tut === 4){ S.tut = 5; save(); }
  ({lesson:startLesson, balloon:startBalloon, race:startRace, boss:startBoss})[n.type](n);
}
const playTop = (pct, extra='') => `<div class="playtop"><button class="x" data-act="quit" aria-label="Leave">✕</button>
  <div class="prog"><i id="pg" style="width:${pct}%"></i></div>${extra}</div>`;
const setProg = pct => { const p = $('#pg'); if(p) p.style.width = pct + '%'; };

/* ================= results ================= */
function renderResult(o){
  enter('result', false);
  const res = o.res;
  view.innerHTML = `<div class="result night">
    ${o.win ? meSVG('class="big bob"') : monsterSVG(o.monster || '#888','class="big"')}
    <h1>${o.title}</h1><p class="muted">${o.sub}</p>
    ${o.win ? `<div class="stars">${[1,2,3].map(i=>`<span class="${i<=o.stars?'on':''}" style="animation-delay:${i*.18}s">★</span>`).join('')}</div>
      <div class="rewards"><span class="pill">🪙 +${res.coins}</span><span class="pill xpp">⚡ +${res.xp} XP</span></div>
      ${res.up ? `<div class="lvlup">Level up! You're level ${S.level}</div>` : ''}` : ''}
    ${newsHTML()}
    <div class="stack" style="margin-top:10px">

/* ================= lesson ================= */
function startLesson(n){
  G = {n, kind:'lesson', i:0, total:8, correct:0, alive:true};
  const p = {a:n.ex[0], b:n.ex[1], op:n.spec.op}; p.ans = calc(p);
  view.innerHTML = `<div class="play">${playTop(0)}
    <div class="coach">${meSVG()}<div class="bubble">Let's learn something new!</div></div>
    <div class="teach"><span class="tag" style="background:${n.w.node}">${n.w.name}</span>
      <h2>${n.title}</h2><p>${n.teach}</p>
      <div class="example"><div class="qtext">${p.a} ${SYM[p.op]} ${p.b} = ${p.ans}</div><div class="model">${model(p)}</div></div>
    </div>
    <button class="btn green" data-act="practice" style="margin-top:auto">Let's practice</button></div>`;
}
function lessonQ(){
  G.q = problem(G.n.spec); G.answered = false;
  const m = model(G.q);
  view.innerHTML = `<div class="play">${playTop(G.i/G.total*100)}
    <div class="coach">${meSVG()}<div class="bubble" id="bub">${pick(['What do you get?','You can do this!','Take your time.','Show me what you know!'])}</div></div>
    <div class="qcard"><div class="qtext">${qtext(G.q)}</div>${m ? `<div class="model">${m}</div>` : ''}</div>
    <div class="answers">${choices(G.q.ans).map(c=>`<button class="ans" data-act="ans" data-v="${c}">${c}</button>`).join('')}</div>
    <div id="fb"></div></div>`;
}
function markAnswers(btn, ans){
  view.querySelectorAll('.ans').forEach(b=>{
    b.disabled = true;
    if(+b.dataset.v === ans) b.classList.add('right');
    else if(b === btn) b.classList.add('wrong');
    else b.classList.add('dim');
  });
}
function answerLesson(btn){
  if(G.answered) return; G.answered = true;
  const ok = +btn.dataset.v === G.q.ans;
  markAnswers(btn, G.q.ans);
  G.i++; G.streak = ok ? (G.streak || 0) + 1 : 0;
  if(ok){ G.correct++; hit(G.streak); }
  setProg(G.i/G.total*100);
  $('#bub').textContent = ok ? pick(PRAISE) : `It's ${G.q.ans}. You'll get the next one!`;
  if(ok){ const tok = G; setTimeout(()=>{ if(G===tok) lessonNext(); }, 750); }
  else $('#fb').innerHTML = `<button class="btn coral" data-act="next">Continue</button>`;
}
function lessonNext(){
  if(G.i < G.total) return lessonQ();
  const c = G.correct, stars = c>=7 ? 3 : c>=5 ? 2 : 1, n = G.n;
  renderResult({win:true, title:'Lesson complete!', sub:`You got ${c} of ${G.total} right. The next game is unlocked.`, stars, res:award(n, stars), id:n.id});
}

/* ================= balloon pop ================= */
function startBalloon(n){
  G = {n, kind:'balloon', target:10, popped:0, miss:0, alive:true};
  view.innerHTML = `<div class="play">${playTop(0, '<span class="pill" id="miss">Misses 0</span>')}
    <div class="qcard slim"><div class="qtext md" id="bq"></div></div>
    <div class="sky" id="sky"></div></div>`;
  newBalloons();
  G.last = performance.now(); requestAnimationFrame(balloonLoop);
}
function newBalloons(){
  const sky = $('#sky'); if(!sky || G.kind!=='balloon') return;
  sky.innerHTML = '<span class="cloud" style="left:8%;top:12%">☁️</span><span class="cloud" style="right:10%;top:40%">☁️</span>';
  G.q = problem(G.n.spec); $('#bq').textContent = qtext(G.q);
  const h = sky.clientHeight, cols = ['#ff6b5b','#4d8cff','#9b6bff','#ffab3d'];
  G.balloons = choices(G.q.ans).map((v, i)=>{
    const el = document.createElement('button');
    el.className = 'balloon'; el.textContent = v; el.dataset.v = v; el.dataset.act = 'pop';
    el.style.background = cols[i]; el.style.left = `calc(${3 + i*24.5}%)`;
    sky.appendChild(el);
    return {el, v, y:h + r(10,150), sp:(46 + r(0,28)) * (1 + G.popped*.05), gone:false};
  });
}
function balloonLoop(t){
  if(!G || G.kind!=='balloon' || !G.alive) return;
  const dt = Math.min(.05, (t - G.last)/1000); G.last = t;
  let escaped = false;
  G.balloons.forEach(b=>{ if(b.gone) return; b.y -= b.sp*dt; b.el.style.transform = `translateY(${b.y}px)`; if(b.y < -140 && b.v === G.q.ans) escaped = true; });
  if(escaped){ G.miss++; G.streak = 0; $('#miss').textContent = `Misses ${G.miss}`; toast(`Too slow! It was ${G.q.ans}.`); newBalloons(); }
  requestAnimationFrame(balloonLoop);
}
function popBalloon(el){
  const b = G.balloons.find(x=>x.el===el); if(!b || b.gone) return;
  if(b.v === G.q.ans){
    b.gone = true; el.classList.add('pop'); G.popped++; setProg(G.popped/G.target*100);
    G.streak = (G.streak || 0) + 1; hit(G.streak);
    G.balloons.forEach(x=>{ x.gone = true; x.el.disabled = true; });
    const tok = G;
    if(G.popped >= G.target){
      G.alive = false;
      setTimeout(()=>{ if(G!==tok) return; const stars = G.miss<=1 ? 3 : G.miss<=3 ? 2 : 1;
        renderResult({win:true, title:'All popped!', sub:`10 balloons popped with ${G.miss} ${G.miss===1?'miss':'misses'}.`, stars, res:award(G.n, stars), id:G.n.id}); }, 450);
    } else setTimeout(()=>{ if(G===tok) newBalloons(); }, 380);
  } else {
    el.classList.add('bad'); el.disabled = true; G.miss++; G.streak = 0; $('#miss').textContent = `Misses ${G.miss}`;
  }
}

/* ================= speed race ================= */
function startRace(n){
  G = {n, kind:'race', pos:0, goal:10, elapsed:0, time:55, mistakes:0, alive:true, lock:false};
  view.innerHTML = `<div class="play">${playTop(0)}
    <div class="track">
      <div class="lane"><div class="finish"></div><span class="lanelabel">You</span><div class="racer" id="me">${meSVG()}</div></div>
      <div class="lane"><div class="finish"></div><span class="lanelabel">Rival</span><div class="racer" id="rv">${monsterSVG(n.w.monster)}</div></div>
    </div>
    <div class="qcard slim"><div class="qtext md" id="rq"></div></div>
    <div class="answers" id="ra"></div></div>`;
  raceQ(); G.last = performance.now(); requestAnimationFrame(raceLoop);
}
const place = (id, f) => { const e = $('#'+id); if(e) e.style.left = `calc((100% - 82px) * ${Math.min(1,f)})`; };
function raceQ(){
  G.q = problem(G.n.spec); G.lock = false;
  $('#rq').textContent = qtext(G.q);
  $('#ra').innerHTML = choices(G.q.ans).map(c=>`<button class="ans" data-act="race" data-v="${c}">${c}</button>`).join('');
}
function raceLoop(t){
  if(!G || G.kind!=='race' || !G.alive) return;
  G.elapsed += Math.min(.05, (t - G.last)/1000); G.last = t;
  place('rv', G.elapsed / G.time);
  if(G.elapsed >= G.time){ G.alive = false; const n = G.n;
    setTimeout(()=>renderResult({win:false, title:'So close!', sub:'The rival reached the finish first. Answer a bit faster and you can win.', monster:n.w.monster, id:n.id}), 400); return; }
  requestAnimationFrame(raceLoop);
}
function answerRace(btn){
  if(G.lock || !G.alive) return; G.lock = true;
  const ok = +btn.dataset.v === G.q.ans;
  markAnswers(btn, G.q.ans);
  const tok = G;
  if(ok){
    G.pos++; place('me', G.pos/G.goal); setProg(G.pos/G.goal*100);
    G.streak = (G.streak || 0) + 1; hit(G.streak);
    if(G.pos >= G.goal){ G.alive = false; const stars = G.mistakes<=1 ? 3 : G.mistakes<=3 ? 2 : 1;
      setTimeout(()=>{ if(G===tok) renderResult({win:true, title:'You won the race!', sub:`Finished with ${G.mistakes} ${G.mistakes===1?'mistake':'mistakes'}.`, stars, res:award(G.n, stars), id:G.n.id}); }, 500); }
    else setTimeout(()=>{ if(G===tok && G.alive) raceQ(); }, 280);
  } else { G.mistakes++; G.streak = 0; setTimeout(()=>{ if(G===tok && G.alive) raceQ(); }, 900); }
}

/* ================= boss battle ================= */
function startBoss(n){
  G = {n, kind:'boss', hp:n.hp || 12, max:n.hp || 12, hearts:3, streak:0, alive:true, lock:false, qt:12, tleft:12};
  view.innerHTML = `<div class="play">${playTop(0)}
    <div class="arena" id="arena">
      <div class="bossrow"><span>${n.w.boss}</span><span id="hpn">${G.hp}/${G.max}</span></div>
      <div class="hp"><i id="hp" style="width:100%"></i></div>
      <div class="mon bob" id="mon">${monsterSVG(n.w.monster)}</div>
      <div class="me">${meSVG()}<span class="hearts" id="hearts"></span></div>
    </div>
    <div class="qtimer"><i id="qt"></i></div>
    <div class="qcard slim"><div class="qtext md" id="bq"></div></div>
    <div class="answers" id="ba"></div></div>`;
  drawHearts(); bossQ(); G.last = performance.now(); requestAnimationFrame(bossLoop);
}
const drawHearts = () => $('#hearts').textContent = '❤️'.repeat(G.hearts) + '🤍'.repeat(3 - G.hearts);
function bossQ(){
  G.q = problem(G.n.spec); G.lock = false; G.tleft = G.qt;
  $('#bq').textContent = qtext(G.q);
  $('#ba').innerHTML = choices(G.q.ans).map(c=>`<button class="ans" data-act="boss" data-v="${c}">${c}</button>`).join('');
}
function bossLoop(t){
  if(!G || G.kind!=='boss' || !G.alive) return;
  const dt = Math.min(.05, (t - G.last)/1000); G.last = t;
  if(!G.lock){ G.tleft -= dt; const q = $('#qt'); if(q) q.style.width = Math.max(0, G.tleft/G.qt*100) + '%';
    if(G.tleft <= 0){ G.lock = true; markAnswers(null, G.q.ans); toast(`Time's up! It was ${G.q.ans}.`); bossHurt(); } }
  requestAnimationFrame(bossLoop);
}
function answerBoss(btn){
  if(G.lock || !G.alive) return; G.lock = true;
  const ok = +btn.dataset.v === G.q.ans;
  markAnswers(btn, G.q.ans);
  if(!ok) return bossHurt();
  G.streak++; hit(G.streak);
  const dmg = G.streak >= 3 ? 2 : 1;
  G.hp = Math.max(0, G.hp - dmg);
  $('#hp').style.width = (G.hp/G.max*100) + '%'; $('#hpn').textContent = `${G.hp}/${G.max}`;
  setProg((G.max - G.hp)/G.max*100);
  const mon = $('#mon'); mon.classList.remove('hit'); void mon.offsetWidth; mon.classList.add('hit');
  const d = document.createElement('div'); d.className = 'dmg'; d.textContent = dmg === 2 ? '-2 Combo!' : '-1';
  $('#arena').appendChild(d); setTimeout(()=>d.remove(), 800);
  const tok = G;
  if(G.hp <= 0){ G.alive = false; const stars = G.hearts;
    if(G.n.wild) return setTimeout(()=>{ if(G===tok) wildWon(G.n, stars); }, 600);

let AC;
function beep(freq, dur=.09, type='sine', vol=.07){
  if(!S.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + dur);
  }catch(e){}
}

function arenaQ(){
  let q, guard = 0;
  if(G.rng) RNG = G.rng;
  do q = problem(pick(G.skill.specs)); while(G.q && qtext(q) === qtext(G.q) && guard++ < 5);

  G.q = q; G.typed = ''; G.busy = false; G.qStart = G.dur - G.left;
  $('#lq').textContent = `${q.a} ${SYM[q.op]} ${q.b} =`;

}
function arenaKey(k){
  if(!G || G.kind !== 'arena' || G.phase !== 'play' || G.busy) return;

  const t = G.dur - G.left - G.qStart, pts = Math.round((100 + speedBonus(t)) * comboMult(G.streak));

function drawBoard(){

function arenaLoop(t){
  if(!G || G.kind !== 'arena' || !G.alive) return;
  const dt = Math.min(.05, (t - G.last)/1000); G.last = t;
  G.left = Math.max(0, G.left - dt);
  G.players.forEach(p=>{
    if(p.you || (p.next -= dt) > 0) return;
    if(Math.random() < p.acc){ p.streak++; p.score += Math.round((100 + speedBonus(p.cur)) * comboMult(p.streak)); }
    else p.streak = 0;
    p.cur = p.next = p.gap * (.6 + Math.random()*.8);
  });
  if((G.tick += dt) > .2){ G.tick = 0; drawBoard(); }
  $('#tm').style.strokeDashoffset = 119.4 * (1 - G.left/G.dur);
  const s = $('#secs'), sec = Math.ceil(G.left);

      <button class="hb" data-act="places" style="--c:#4d8cff;--d:#2f67d6"><i>🗺️</i>Places</button>
      <button class="hb" data-act="arena" style="--c:#ffb432;--d:#d98a12"><i>⚡</i>Arena</button>
      <button class="hb ${canClaim() ? 'has' : ''}" data-act="goals" style="--c:#ff6b5b;--d:#d94a3c"><i>🎯</i>Quests</button>
      <button class="hb" data-act="me" style="--c:#9b6bff;--d:#7445e0"><i>🎒</i>Backpack</button>
    </div>
  </div>`;
  $('#world').addEventListener('pointerdown', worldTap);
  W.coachKey = null; updateCoach();
  requestAnimationFrame(worldLoop);
}
function putActor(el, x, y){ el.style.transform = `translate(${x - 32}px,${y - 60}px)`; el.style.zIndex = 1000 + (y|0); }
function worldTap(e){
  if(!W || !W.alive || e.target.closest('button,.prompt,.coachbox,.hudtop,.hudbar')) return;
  const x = e.clientX + W.cx, y = e.clientY + W.cy;
  const mon = wildList().find(m => m.on && Math.hypot(m.x - x, m.y - 28 - y) < 48);
  if(mon){ walkTo(mon.x, mon.y, {type:'mon', m:mon}); return; }
  const npc = W.npcs.find(n => Math.hypot(n.x - x, n.y - 28 - y) < 44);
  if(npc){ say($('#npc' + W.npcs.indexOf(npc)), pick(TIPS)); walkTo(npc.x + (W.x < npc.x ? -60 : 60), npc.y, null); return; }
  const p = PLACES.find(p => Math.hypot(p.x - x, p.y - 70 - y) < 110);
  if(p){ walkTo(p.x, p.y + 12, {type:'place', p}); return; }
  walkTo(x, y, null);
  const fx = document.createElement('div'); fx.className = 'tapfx'; fx.style.left = x + 'px'; fx.style.top = y + 'px';
  $('#cam').appendChild(fx); setTimeout(() => fx.remove(), 500);
}
function walkTo(x, y, goal, fast=false){ [x, y] = clampIsland(x, y); W.target = {x, y}; W.goal = goal; W.fast = fast; }
function say(el, text){
  if(!el) return;
  el.querySelectorAll('.say').forEach(s => s.remove());
  const b = document.createElement('div'); b.className = 'say'; b.textContent = text; el.appendChild(b);
  setTimeout(() => b.remove(), 3400);
}
const KEYS = {};
function worldLoop(t){
  if(!W || !W.alive) return;
  const dt = Math.min(.05, (t - W.last)/1000); W.last = t;
  const kx = (KEYS.ArrowRight || KEYS.d ? 1 : 0) - (KEYS.ArrowLeft || KEYS.a ? 1 : 0), ky = (KEYS.ArrowDown || KEYS.s ? 1 : 0) - (KEYS.ArrowUp || KEYS.w ? 1 : 0);
  let mx = 0, my = 0;
  const busy = !!$('#sheet').innerHTML;
  if(!busy && (kx || ky)){ const k = Math.hypot(kx, ky); mx = kx/k; my = ky/k; W.target = null; W.goal = null; W.fast = false; }
  else if(!busy && W.target){
    const dx = W.target.x - W.x, dy = W.target.y - W.y, d = Math.hypot(dx, dy), step = (W.fast ? 560 : 250)*dt;
    if(d <= step){ W.x = W.target.x; W.y = W.target.y; W.target = null; W.fast = false; }
    else { mx = dx/d; my = dy/d; }
  }
  const sp = (W.fast ? 560 : 250)*dt;
  if(mx || my){ [W.x, W.y] = clampIsland(W.x + mx*sp, W.y + my*sp); W.walked += sp; }
  const pl = $('#pl'); putActor(pl, W.x, W.y);
  pl.classList.toggle('walk', !!(mx || my)); if(mx) pl.classList.toggle('left', mx < 0);
  // friendly islanders wander around their spot and chat now and then
  W.npcs.forEach((n, i) => {
    const el = $('#npc' + i);
    if((n.wait -= dt) <= 0){ n.tx = n.hx + (Math.random() - .5)*220; n.ty = n.hy + (Math.random() - .5)*160; n.wait = 3 + Math.random()*4; }
    const dx = n.tx - n.x, dy = n.ty - n.y, d = Math.hypot(dx, dy), moving = d > 3;
    if(moving){ n.x += dx/d*45*dt; n.y += dy/d*45*dt; el.classList.toggle('left', dx < 0); }
    el.classList.toggle('walk', moving); putActor(el, n.x, n.y);
  });
  if((W.chat -= dt) <= 0){ W.chat = 8 + Math.random()*5; const n = W.npcs.find(n => Math.hypot(n.x - W.x, n.y - W.y) < 420); if(n) say($('#npc' + W.npcs.indexOf(n)), pick(TIPS)); }
  // wild monsters roam near their zone; walking into one starts a battle
  W.cool = Math.max(0, W.cool - dt);
  wildList().forEach((m, i) => {
    const el = $('#mon' + i); m.on = zoneOpen(m.wi) && Date.now() > m.back; el.hidden = !m.on; if(!m.on) return;
    if((m.wait -= dt) <= 0){ m.tx = m.hx + (Math.random() - .5)*160; m.ty = m.hy + (Math.random() - .5)*120; m.wait = 2 + Math.random()*3; }
    const dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy);
    if(d > 3){ m.x += dx/d*60*dt; m.y += dy/d*60*dt; el.classList.toggle('left', dx < 0); }
    putActor(el, m.x, m.y);
    if(!busy && !W.cool && S.tut > 2 && Math.hypot(m.x - W.x, m.y - W.y) < 50) encounter(m);
  });
  // camera follows the player, eased, and never shows past the world edge
  const vw = innerWidth, vh = innerHeight;
  const tx = vw >= WW ? (WW - vw)/2 : Math.max(0, Math.min(WW - vw, W.x - vw/2)), ty = vh >= WH ? (WH - vh)/2 : Math.max(0, Math.min(WH - vh, W.y - vh/2 + 40));
  if(W.first){ W.cx = tx; W.cy = ty; W.first = false; } else { W.cx += (tx - W.cx)*Math.min(1, dt*7); W.cy += (ty - W.cy)*Math.min(1, dt*7); }
  $('#cam').style.transform = `translate(${-W.cx}px,${-W.cy}px)`;
  const near = PLACES.find(p => Math.hypot(p.x - W.x, p.y + 12 - W.y) < 95) || null;
  if(near !== W.near){ W.near = near; showPrompt(); }
  if(S.tut === 1 && W.walked > 150){ S.tut = 2; save(); }
  if(S.tut === 2 && near && near.id === 'z0'){ S.tut = 3; save(); showPrompt(); }
  if(S.tut === 3 && (!near || near.id !== 'z0')){ S.tut = 2; save(); }
  updateCoach();
  requestAnimationFrame(worldLoop);
}
function showPrompt(){
  const el = $('#prompt'), p = W.near;
  el.hidden = !p; if(!p) return;
  const open = placeOpen(p), zone = p.kind === 'zone' ? NODES.filter(n => n.wi === p.wi) : null;
  const extra = zone && open ? ` ⭐ ${zone.reduce((a, n) => a + (S.done[n.id] || 0), 0)}/18` : '';
  el.innerHTML = `<span class="pi">${p.icon}</span><div><b>${p.name}${extra}</b><small>${open ? p.blurb : lockText(p)}</small></div>
    ${open ? `<button class="btn green ${S.tut === 3 ? 'hl' : ''}" data-act="enter" data-v="${p.id}">Enter</button>` : '<button class="btn ghost" disabled>🔒</button>'}`;
}
function enterPlace(id){
  const p = PLACES.find(x => x.id === id); if(!p || !placeOpen(p)) return;
  if(p.kind === 'zone'){ if(S.tut === 3){ S.tut = 4; save(); } return renderZone(p.wi); }
  if(p.kind === 'arena') return renderArena();
  if(p.kind === 'goals') return renderGoals();
  meTab = 'hats'; renderCrew();
}
function updateCoach(){
  const tut = S.tut, z0 = PLACES[0];
  let text = '', btn = '', ptr = null;
  if(tut === 1) text = `Hi ${esc(S.name)}! Tap anywhere on the grass to walk around.`;
  else if(tut === 2 || (tut === 5 && !S.done['add-0'])){ text = tut === 2 ? 'Now walk to Addition Village. Follow the arrow!' : 'Your first lesson is waiting in Addition Village!'; ptr = z0; }
  else if(tut === 3) text = 'You made it! Tap <b>Enter</b> to go inside.';
  else if(tut === 5){ text = 'Awesome job! Explore the island: 🎯 quests, 🎩 hats and ⚡ races. Wild monsters hide near each place, so tap one to battle it!'; btn = '<button class="btn green sm" data-act="tutdone">Got it!</button>'; }
  const key = text + btn;
  if(key !== W.coachKey){ W.coachKey = key; $('#coach').innerHTML = text ? coachBox(text, btn) : ''; }
  const wp = $('#wptr'); wp.hidden = !ptr;
  if(ptr) wp.style.transform = `translate(${ptr.x}px,${ptr.y - ptr.label - 34}px)`;
}
function encounter(m){
  W.target = null; W.goal = null;
  const w = WORLDS[m.wi];
  $('#sheet').innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-label="Wild monster">
    ${monsterSVG(m.color, 'class="who bob"')}
    <span class="tag" style="background:${w.node}">Wild monster</span>
    <h2>A wild ${m.name} appears!</h2>
    <p class="muted">Answer ${w.name.split(' ')[0].toLowerCase()} questions to beat it and win coins.</p>
    <div class="stack"><button class="btn coral" data-act="battle" data-v="${wildList().indexOf(m)}">⚔️ Battle!</button>
    <button class="btn ghost" data-act="run">Run away</button></div></div></div>`;
}
function runAway(){
  closeSheet(); W.cool = 3;
  const m = wildList().find(m => Math.hypot(m.x - W.x, m.y - W.y) < 80);
  if(m){ const dx = W.x - m.x, dy = W.y - m.y, d = Math.hypot(dx, dy) || 1; walkTo(W.x + dx/d*90, W.y + dy/d*90, null); }
}
function startWild(i){
  const m = wildList()[i], w = WORLDS[m.wi];
  closeSheet(); enter('play');
  startBoss({id:'wild', type:'boss', wild:true, m, hp:6, wi:m.wi, title:m.name, spec:w.nodes[1].spec, w:Object.assign({}, w, {boss:m.name, monster:m.color})});
}
function wildWon(n, stars){
  n.m.back = Date.now() + 90e3; track('wild');
  renderResult({win:true, title:`You beat ${n.m.name}!`, sub:'It ran back into the bushes. It might come back later.', stars, res:grant(10 + stars*5, 15 + stars*5), id:null});
}
function openPlaces(){
  const here = W && W.near;
  $('#sheet').innerHTML = `<div class="overlay" data-act="close"><div class="sheet" role="dialog" aria-label="Places">
    <h2>Where to?</h2><p class="muted">Pick a place and you'll walk there.</p>
    <div class="places">${PLACES.map(p => { const open = placeOpen(p);
      return `<button class="place ${open ? '' : 'locked'}" data-act="go" data-v="${p.id}"><span class="pi">${p.icon}</span>
        <span><b>${p.name}</b><small>${here === p ? 'You are here' : open ? p.blurb : lockText(p)}</small></span><span class="go">${open ? 'Go' : '🔒'}</span></button>`; }).join('')}</div>
    <button class="btn ghost" data-act="close">Close</button></div></div>`;
}
function travel(id){
  const p = PLACES.find(x => x.id === id); if(!p) return;
  closeSheet(); walkTo(p.x, p.y + 12, {type:'place', p}, true);
}
function openSettings(){
  $('#sheet').innerHTML = `<div class="overlay" data-act="close"><div class="sheet" role="dialog" aria-label="Settings">
    <div class="ico">⚙️</div><h2>Settings</h2>
    <div class="setlist">
      <button class="btn ghost" data-act="sound2">${S.sound ? '🔊 Sound is on' : '🔇 Sound is off'}</button>
      <button class="btn ghost" data-act="retut">🎓 Replay the tutorial</button>
      <button class="btn ghost" data-act="rename">✏️ Change name or buddy</button>
    </div>
    <button class="btn green" data-act="close">Done</button></div></div>`;
}

/* ================= first-run setup ================= */
let SU = null;
const ADJ = ['Rocket','Turbo','Cosmic','Super','Mighty','Sneaky','Happy','Brave','Zippy','Lucky','Sparkly','Ninja'];
const ANI = ['Panda','Tiger','Otter','Falcon','Koala','Dragon','Fox','Shark','Bunny','Owl','Llama','Penguin'];
function renderSetup(step='hello'){
  enter('setup');
  SU = SU || {name:S.name || '', char:S.char || 'pip'}; SU.step = step;
  const steps = ['name', 'buddy', 'grade'], idx = steps.indexOf(step);
  let body = '';
  if(step === 'hello') body = `<div class="logo">100<span>Math</span></div>
    <p class="tagline">Explore the island, battle math monsters and become a math legend!</p>
    ${charSVG(SU.char, 'class="heropip bob"')}
    <button class="btn green big" data-act="su-go" data-v="name">Let's play!</button>`;
  if(step === 'name') body = `<h1>What's your hero name?</h1><p class="sub">Use a nickname, not your real name.</p>
    <div class="namebox"><input id="suname" maxlength="14" placeholder="Hero name" autocomplete="off" value="${esc(SU.name)}"><button class="dice" data-act="su-dice" aria-label="Pick a random name">🎲</button></div>
    <button class="btn green big" id="sunext" data-act="su-go" data-v="buddy" ${SU.name.trim() ? '' : 'disabled'}>Next</button>`;
  if(step === 'buddy') body = `<h1>Pick your buddy</h1><p class="sub">They'll explore the island with you.</p>
    <div class="pickgrid">${Object.entries(CHARS).map(([id, c]) => `<button class="pick ${SU.char === id ? 'on' : ''}" data-act="su-char" data-v="${id}">${charSVG(id)}<b>${c.name}</b></button>`).join('')}</div>
    <button class="btn green big" data-act="su-go" data-v="grade">Next</button>`;
  if(step === 'grade') body = `<h1>What grade are you in?</h1><p class="sub">We'll open the right places for you.</p>
    <div class="grades">${['K – 1st','2nd','3rd','4th +'].map((g, i) => `<button class="grade" data-act="su-grade" data-v="${i}"><b>${g}</b><small>${['Start with adding','Adding and taking away','Up to times tables','Everything, even division'][i]}</small></button>`).join('')}</div>`;
  view.innerHTML = `<div class="setup">${idx > 0 ? `<button class="back" data-act="su-go" data-v="${steps[idx-1]}" aria-label="Back">←</button>` : ''}
    ${idx >= 0 ? `<div class="dots">${steps.map((s, i) => `<i class="${i <= idx ? 'on' : ''}"></i>`).join('')}</div>` : ''}
    <div class="sucard">${body}</div></div>`;
  if(step === 'name') setTimeout(() => { const i = $('#suname'); if(i) i.focus(); }, 60);
}
function setupGo(step){
  if(SU.step === 'name'){ SU.name = $('#suname').value.trim(); if(!SU.name && step !== 'hello') return; }
  renderSetup(step);
}
function finishSetup(grade){
  const fresh = !S.tut;
  S.name = SU.name; S.char = SU.char; if(!S.owned.includes(SU.char)) S.owned.push(SU.char);
  S.grade = grade; S.seen = true;
  if(fresh){ S.tut = 1; S.pos = null; }
  save(); SU = null;
  renderWorld(); if(fresh) confetti();
}

/* ================= events ================= */
document.addEventListener('click', e=>{
  const node = e.target.closest('[data-node]');
  if(node){ openSheet(node.dataset.node); return; }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a === 'close'){ if(e.target === el || el.tagName === 'BUTTON') closeSheet(); return; }
  if(a === 'start') return startNode(v);
  if(a === 'quit' || a === 'tomap') return goBack();
  if(a === 'practice') return lessonQ();
  if(a === 'ans') return answerLesson(el);
  if(a === 'next') return lessonNext();
  if(a === 'pop') return popBalloon(el);
  if(a === 'race') return answerRace(el);
  if(a === 'boss') return answerBoss(el);
  if(a === 'arena') return renderArena();
  if(a === 'arena-go') return startArena(v);
  if(a === 'daily') return startArena('mix', true);
  if(a === 'dur'){ S.dur = +v; save(); return renderArena(); }
  if(a === 'sound'){ S.sound = !S.sound; save(); return renderArena(); }
  if(a === 'key') return arenaKey(v);
  if(a === 'skip'){ if(G && G.kind === 'arena' && G.phase === 'play' && !G.busy) arenaMiss(false); return; }
  if(a === 'pickc'){ S.char = v; save(); return renderCrew(); }
  if(a === 'buyc'){ const c = CHARS[v]; if(S.coins < c.price) return;
    S.coins -= c.price; S.owned.push(v); S.char = v; toast(`${c.name} joined your crew!`); checkBadges(); save(); return renderCrew(); }
  if(a === 'metab'){ meTab = v; return renderCrew(); }
  if(a === 'buyh'){ const h = HATS[v]; if(S.coins < h.price) return;
    S.coins -= h.price; S.hats.push(v); S.hat = v; toast(`You got the ${h.name}!`); checkBadges(); save(); return renderCrew(); }
  if(a === 'wear'){ S.hat = v || null; save(); closeSheet(); return tab === 'goals' ? renderGoals() : renderCrew(); }
  if(a === 'claim') return claimQuest(v);
  if(a === 'chest') return openChest();
  if(a === 'world') return renderWorld();
  if(a === 'enter') return enterPlace(v);
  if(a === 'places') return openPlaces();
  if(a === 'go') return travel(v);
  if(a === 'goals') return renderGoals();
  if(a === 'me') return renderCrew();
  if(a === 'settings') return openSettings();
  if(a === 'sound2'){ S.sound = !S.sound; save(); return openSettings(); }
  if(a === 'retut'){ S.tut = 1; S.pos = null; save(); closeSheet(); return renderWorld(); }
  if(a === 'rename'){ closeSheet(); SU = null; return renderSetup('name'); }
  if(a === 'tutdone'){ S.tut = 99; save(); W.coachKey = null; return updateCoach(); }
  if(a === 'battle') return startWild(+v);
  if(a === 'run') return runAway();
  if(a === 'su-go') return setupGo(v);
  if(a === 'su-dice'){ SU.name = `${pick(ADJ)} ${pick(ANI)}`; $('#suname').value = SU.name; $('#sunext').disabled = false; return; }
  if(a === 'su-char'){ SU.char = v; return renderSetup('buddy'); }
  if(a === 'su-grade') return finishSetup(+v);
});
document.addEventListener('input', e=>{
  if(e.target.id === 'suname'){ SU.name = e.target.value; $('#sunext').disabled = !e.target.value.trim(); }
});
document.addEventListener('keydown', e=>{
  if(e.target.id === 'suname'){ if(e.key === 'Enter' && e.target.value.trim()) setupGo('buddy'); return; }
  if(W && W.alive && !G){
    if(/^(Arrow(Up|Down|Left|Right)|[wasd])$/.test(e.key)){ KEYS[e.key] = true; e.preventDefault(); }
    else if(e.key === 'Enter' && W.near && !$('#sheet').innerHTML){ e.preventDefault(); enterPlace(W.near.id); }
    return;
  }
  if(G && G.kind === 'arena'){
    const k = /^[0-9]$/.test(e.key) ? e.key : e.key === 'Backspace' ? 'del' : e.key === 'Enter' ? 'ok' : null;
    if(!k || (k === 'ok' && e.target.closest && e.target.closest('.x'))) return;
    e.preventDefault(); return arenaKey(k);
  }
  if(!G || !/^[1-4]$/.test(e.key)) return;
  const btn = view.querySelectorAll('.ans')[+e.key - 1];
  if(btn && !btn.disabled) btn.click();
});

document.addEventListener('keyup', e=>{ delete KEYS[e.key]; });
addEventListener('blur', ()=>{ for(const k in KEYS) delete KEYS[k]; });

renderWorld();
</script>
</body>
</html>
