  $('#tm').style.strokeDashoffset = 119.4*(1 - G.left/G.dur);
  const s = $('#secs'), sec = Math.ceil(G.left);
  if(s.textContent != sec){ s.textContent = sec; $('#timer').classList.toggle('low', sec <= 10); if(sec <= 5 && sec > 0) beep(990, .05, 'sine', .04); }
  if(G.left <= 0) return arenaEnd();
  requestAnimationFrame(arenaLoop);
}
function arenaEnd(){
  const tok = G;
  G.alive = false; G.phase = 'end'; drawBoard();
  $('#sheet').innerHTML = `<div class="timesup">Time's up</div>`;
  beep(330, .35, 'triangle', .08);
  setTimeout(() => { closeSheet(); if(G === tok) arenaResult(); }, 1100);
}
function arenaResult(){
  const g = G, ranked = g.players.slice().sort(byScore), place = ranked.indexOf(g.me) + 1, dk = `${S.grade}-${dayKey()}`;
  const key = `${S.grade}-${g.poolId}-${g.dur}`, prev = g.daily ? S.daily[dk] : S.best[key], firstDaily = g.daily && prev == null;
  const pb = g.score > 0 && (prev == null || g.score > prev);
  if(pb){ if(g.daily) S.daily[dk] = g.score; else S.best[key] = g.score; }
  const rate = g.correct/g.dur, old = S.rate[g.rkey];
  S.rate[g.rkey] = Math.max(.06, old ? old*.6 + rate*.4 : rate);
  S.games++;
  const li = league(), dt = TROPHY[place - 1];
  S.trophies = Math.max(0, S.trophies + dt);
  if(league() > li) news(`🏆 Promoted to the ${LEAGUES[league()][0]} league!`);
  track('arena'); if(place <= 3) track('podium'); if(place === 1) track('win'); if(g.daily) track('daily');
  const res = grant(5 + Math.round(g.correct*2) + ([20,12,8][place - 1] || 0) + (firstDaily ? 30 : 0), 10 + g.correct*5);
  const tries = g.correct + g.wrong, acc = tries ? Math.round(g.correct/tries*100) : 0;
  enter('results', true, false);
  view.innerHTML = `<div class="res">
    <div class="eyebrow">${g.daily ? 'Daily challenge' : g.pool.name}</div>
    <h1>${place === 1 ? 'You won!' : `${ord(place)} place`}</h1>
    <p>${g.correct} correct in ${g.dur/60} minute${g.dur > 60 ? 's' : ''}. ${place === 1 ? 'Nobody was faster.' : place <= 3 ? 'You made the podium.' : 'Build a streak to climb higher.'}</p>
    <div class="podium">${[1,0,2].map(i => { const p = ranked[i];
      return `<div class="pod p${i + 1} ${p.you ? 'you' : ''}">${avHTML(p.av)}<span class="nm">${esc(p.name)}</span><span class="muted">${p.score}</span><div class="blk">${i + 1}</div></div>`; }).join('')}</div>
    ${pb ? `<span class="chip gold">${ic('star')} ${g.daily ? 'Best daily score today' : 'New personal best'}</span>` : ''}
    <div class="statrow" style="grid-template-columns:repeat(4,minmax(0,1fr))"><div class="stat"><b>${g.score}</b><span>Points</span></div><div class="stat"><b>${g.correct}</b><span>Correct</span></div>
      <div class="stat"><b>${acc}%</b><span>Accuracy</span></div><div class="stat"><b>${g.bestStreak}</b><span>Best streak</span></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><span class="chip gold">${ic('coin')} +${res.coins}</span><span class="chip">${ic('star')} +${res.xp} XP</span>
      <span class="chip" style="color:${dt < 0 ? 'var(--bad)' : 'var(--gold)'}">${ic('trophy')} ${dt < 0 ? dt : '+' + dt}</span></div>
    ${newsHTML()}
    ${g.misses.length ? `<div class="breakdown"><div class="eyebrow" style="margin-bottom:8px">Worth practicing</div><div class="reco">${g.misses.slice(0, 4).map(sk => `<button class="btn ghost sm" data-act="practice-skill" data-v="${sk}">${ic('refresh')} ${SKILLS[sk].name}</button>`).join('')}</div></div>` : ''}
    <div class="resbtns"><button class="btn ghost lg" data-act="arena">Back to Arena</button><button class="btn lg" data-act="${g.daily ? 'daily' : 'race'}" data-v="${g.poolId}">${ic('refresh')} Race again</button></div></div>`;
  if(place <= 3) confetti();
}

/* ================= rewards ================= */
function claimQuest(id){
  const q = quests();
  if(!q.ids.includes(id) || q.claimed.includes(id) || !questDone(id)) return;
  q.claimed.push(id); S.coins += QBY[id].coins;
  track('quests'); beep(784, .12, 'triangle'); toast(`+${QBY[id].coins} coins`);
  renderHome();
}
function openChest(){
  const q = quests(); if(q.chest || q.claimed.length < 3) return;
  const coins = r(40, 100), locked = Object.keys(THEMES).filter(t => !S.themes.includes(t)), theme = locked.length && Math.random() < .35 ? pick(locked) : null;
  q.chest = true; S.coins += coins; if(theme) S.themes.push(theme);
  save(); renderHome();
  sheet(`<div class="big">🎁</div><h2>${theme ? `You unlocked the ${THEMES[theme][0]} theme!` : 'Daily chest'}</h2><p>+${coins} coins${theme ? ' and a new theme color' : ''}. Come back tomorrow for another chest.</p>
    <div class="stack">${theme ? `<button class="btn" data-act="theme" data-v="${theme}">Use ${THEMES[theme][0]}</button>` : ''}<button class="btn ${theme ? 'ghost' : ''}" data-act="close">Awesome</button></div>`);
  confetti(); beep(660, .12); setTimeout(() => beep(990, .25, 'triangle'), 120);
}
function setTheme(id){
  const t = THEMES[id]; if(!t) return;
  if(!S.themes.includes(id)){
    if(S.coins < t[2]) return toast(`You need ${t[2] - S.coins} more coins for ${t[0]}.`);
    S.coins -= t[2]; S.themes.push(id); toast(`${t[0]} unlocked!`);
  }
  S.theme = id; save(); applyTheme(); closeSheet();
  tab === 'profile' ? renderProfile() : shell();
}

/* ================= events ================= */
const PAGES = {home:renderHome, path:renderPath, arena:renderArena, market:renderMarket, progress:renderProgress, profile:renderProfile};
function goTab(t){ RET = t; if(t === 'path') pathGrade = null; PAGES[t](); }
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if(go){ closeSheet(); return goTab(go.dataset.go); }
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a === 'close'){ if(e.target === el || el.tagName === 'BUTTON') closeSheet(); return; }
  if(a === 'ob') return obGo(v);
  if(a === 'ob-course'){ OB.grade = +v; return renderOnboard('course'); }
  if(a === 'ob-av'){ OB.avatar = v; return renderOnboard('avatar'); }
  if(a === 'ob-finish') return obFinish(v);
  if(a === 'open') return openItem(v);
  if(a === 'key') return typeKey(v);
  if(a === 'next') return nextQ();
  if(a === 'practice') return askQ();
  if(a === 'nextstep'){ G.shown++; return drawSteps(); }
  if(a === 'hint') return G && G.q && !G.busy && feedback('info', 'Hint', `<p>${G.q.hint}</p>`);
  if(a === 'dunno'){ if(G && G.kind === 'diag' && !G.busy){ G.busy = true; recordAnswer(G.q.skill, false, false); G.res[G.i] = 'cur'; nextQ(); } return; }
  if(a === 'quit') return goTab(RET);
  if(a === 'practice-skill'){ closeSheet(); return startLesson(null, v); }
  if(a === 'path-course'){ pathGrade = +v; return renderPath(); }
  if(a === 'set-course'){ S.grade = +v; pathGrade = null; save(); toast(`${COURSES[S.grade].name} is now your course.`); return tab === 'path' ? renderPath() : renderProfile(); }
  if(a === 'claim') return claimQuest(v);
  if(a === 'chest') return openChest();
  if(a === 'arena'){ closeSheet(); RET = 'arena'; return renderArena(); }
  if(a === 'race') return startArena(v);
  if(a === 'daily') return startArena('mix', true);
  if(a === 'dur'){ S.dur = +v; save(); return renderArena(); }
  if(a === 'skip'){ if(G && G.kind === 'arena' && G.phase === 'play' && !G.busy) arenaMiss(false); return; }
  if(a === 'guest'){ closeSheet(); return playGuest(); }
  if(a === 'signout') return signOut();
  if(a === 'google-off') return sheet(`<div class="big">🔑</div><h2>Google sign-in is almost ready</h2><p>Signing in with Google hasn't been switched on for this site yet. You can play as a guest for now, and your progress will move to your account when you sign in later.</p>
    <div class="stack"><button class="btn" data-act="guest">Play as a guest</button><button class="btn ghost" data-act="close">Close</button></div>`);
  if(a === 'openbox'){ closeSheet(); return openBox(v); }
  if(a === 'equip') return equip(v);
  if(a === 'buy-starter'){ if(!AV[v] || AV[v].pack !== 'starter' || S.avatars.includes(v)) return;
    if(S.coins < STARTER_PRICE) return toast(`You need ${STARTER_PRICE - S.coins} more coins.`);
    S.coins -= STARTER_PRICE; S.avatars.push(v); checkBadges(); save(); return equip(v); }
  if(a === 'theme') return setTheme(v);
  if(a === 'mode'){ S.mode = v; save(); applyTheme(); return renderProfile(); }
  if(a === 'sound'){ S.sound = v === '1'; save(); return renderProfile(); }
  if(a === 'save-name'){ const n = $('#nameedit').value.trim(); if(!n) return; S.name = n; save(); toast('Name saved.'); return renderProfile(); }
  if(a === 'diag') return startDiag();
  if(a === 'reset') return sheet(`<div class="big">⚠️</div><h2>Reset everything?</h2><p>This erases your path, scores, coins and badges on this device. It can't be undone.</p>
    <div class="stack"><button class="btn" style="background:var(--bad);box-shadow:none;color:#fff" data-act="reset-yes">Yes, reset</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
  if(a === 'reset-yes'){ const acct = S.account; store.del(keyFor(WHO)); S = defaults(); S.account = acct; if(acct) S.name = acct.name.split(' ')[0]; save(); closeSheet(); applyTheme(); OB = null; return renderOnboard(WHO ? 'name' : 'welcome'); }
});
document.addEventListener('input', e => {
  if(e.target.id === 'obname'){ OB.name = e.target.value; $('#obnext').disabled = !e.target.value.trim(); }
});
document.addEventListener('keydown', e => {
  if(e.target.id === 'obname'){ if(e.key === 'Enter' && e.target.value.trim()) obGo('course'); return; }
  if(e.target.id === 'nameedit'){ if(e.key === 'Enter') $('[data-act="save-name"]').click(); return; }
  if(!G || !('typed' in G)) return;
  if(e.key === 'Enter' && e.target.closest && e.target.closest('button') && !e.target.closest('.key')) return;
  const k = /^[0-9]$/.test(e.key) ? e.key : {'.':'.', '-':'-', '/':'/', Backspace:'del', Enter:'ok'}[e.key];
  if(!k) return;
  e.preventDefault(); typeKey(k);
});

/* ================= boot ================= */
const dayNum = k => k.split('-').reduce((a, v) => a*100 + +v, 0);
Object.keys(S.days).sort((a, b) => dayNum(b) - dayNum(a)).slice(60).forEach(k => delete S.days[k]);
applyTheme();
WHO && S.onboarded ? renderHome() : renderOnboard(WHO ? 'name' : 'welcome');
</script>
</body>
</html>
